<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFCF7">
<title>Yazılı Antrenman</title>
<link rel="icon" href="img/capy-circle.png">
<link rel="apple-touch-icon" href="img/capy-circle.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FCFCF7;
    --grid: #DEE6EE;
    --ink: #1A2434;
    --ink-soft: #64748B;
    --rule: #E8344E;
    --red: #E8344E;
    --red-wash: #FDE9EC;
    --green: #1E9E5A;
    --green-wash: #E3F6EB;
    --bio: #B6F03C;
    --kim: #FF5FA2;
    --mat: #6CCBFF;
    --alm: #FFC93C;
    --hl: var(--bio);
    --shadow: 3px 3px 0 var(--ink);
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Work Sans", system-ui, sans-serif;
    --hand: "Caveat", "Segoe Script", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #11161E;
      --grid: #1E2733;
      --ink: #E9EFF6;
      --ink-soft: #8DA0B5;
      --rule: #FF5068;
      --red: #FF6478;
      --red-wash: #2C1620;
      --green: #4BD489;
      --green-wash: #10281D;
      --shadow: 3px 3px 0 #000;
    }
  }
  :root[data-theme="dark"] {
    --paper: #11161E; --grid: #1E2733; --ink: #E9EFF6; --ink-soft: #8DA0B5;
    --rule: #FF5068; --red: #FF6478; --red-wash: #2C1620;
    --green: #4BD489; --green-wash: #10281D; --shadow: 3px 3px 0 #000;
  }
  [data-subject="bio"] { --hl: var(--bio); }
  [data-subject="kim"] { --hl: var(--kim); }
  [data-subject="mat"] { --hl: var(--mat); }
  [data-subject="alm"] { --hl: var(--alm); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  .shell { max-width: 620px; margin: 0 auto; padding: 0 16px; }
  #app {
    max-width: 620px; margin: 0 auto;
    border-left: 2px solid var(--rule);
    padding: 0 16px 160px 18px;
    min-height: 100vh;
  }

  /* ---- başlık ---- */
  /* ---- açılış ekranı ---- */
  #intro {
    position: fixed; inset: 0; z-index: 50; background: var(--paper);
    display: grid; place-content: center; justify-items: center; gap: 16px;
    transition: opacity .4s ease;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro img { width: 132px; height: 132px; border-radius: 50%; border: 3px solid var(--ink); }
  #intro .introname { font-family: var(--hand); font-weight: 700; font-size: 38px; color: var(--red); margin: 0; }
  @media (prefers-reduced-motion: no-preference) {
    #intro img { animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; }
    #intro .introname { animation: rise .45s .22s ease both; }
  }
  @keyframes pop { from { transform: scale(.55) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---- ekran üstü gezinme ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 0; min-height: 44px; }
  .backbtn {
    background: none; border: 0; color: var(--ink-soft); cursor: pointer;
    font-family: var(--body); font-size: 15px; padding: 10px 12px 10px 0;
  }
  .step { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---- vurgu kalemi ---- */
  /* fosforlu kalem izi: metnin altını kaplayan, üstte ince boşluk bırakan bant */
  .hl {
    background-image: linear-gradient(to top, var(--hl) 0 88%, transparent 88%);
    color: #11161E;
    padding: 0 .12em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* ---- ana ekran ---- */
  .hero { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 9vw, 42px); line-height: 1.04; letter-spacing: -.03em; margin: 22px 0 6px; }
  .hero-note { color: var(--ink-soft); font-size: 15px; margin-bottom: 26px; }

  .credit { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 14px; color: var(--ink-soft); margin: 12px 0 22px; }
  .hand {
    font-family: var(--hand); font-weight: 700; font-size: 29px; line-height: .9;
    color: whitesmoke; transform: rotate(-2deg);
  }
  .peekrow { position: relative; height: 72px; margin-top: 22px; border-bottom: 1px dashed var(--ink-soft); }
  .peekrow img { position: absolute; right: 2px; bottom: -1px; width: 118px; }

  .subject {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 2px;
    box-shadow: var(--shadow);
    padding: 18px 16px; margin: 0 0 18px;
    font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.02em;
  }
  .subject:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .subject .count { display: block; font-family: var(--body); font-weight: 400; font-size: 14px; letter-spacing: 0; color: var(--ink-soft); margin-top: 6px; }

  .scribble { font-size: 14px; color: var(--ink-soft); padding-top: 12px; margin: 0; }

  /* ---- konu listesi ---- */
  .unit {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid var(--grid);
    padding: 14px 0; color: var(--ink); font-family: var(--body); font-size: 16px;
  }
  .unit .row { display: flex; align-items: baseline; gap: 12px; }
  .unit .nm { flex: 1; font-weight: 500; }
  .unit .pct { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }
  .unit .mini { height: 7px; margin-top: 8px; background: var(--grid); }
  .unit .mini > i { display: block; height: 100%; background: var(--hl); }
  .unit .cnt { font-size: 13px; color: var(--ink-soft); margin-top: 5px; }

  /* ---- genel buton ---- */
  .btn {
    display: block; width: 100%; min-height: 54px; padding: 14px 16px; cursor: pointer;
    font-family: var(--body); font-size: 16px; font-weight: 500; text-align: center;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 2px; margin: 10px 0;
  }
  .btn.solid { background: var(--ink); color: var(--paper); font-weight: 600; box-shadow: var(--shadow); }
  .btn.solid:active { transform: translate(2px, 2px); box-shadow: none; }
  .btn.ghost { border-color: var(--grid); color: var(--ink-soft); }

  /* ---- soru ---- */
  .track { height: 8px; background: var(--grid); margin: 16px 0 18px; }
  .track > i { display: block; height: 100%; background: var(--hl); transition: width .3s ease; }
  .unitname { font-size: 13px; color: var(--ink-soft); }
  .qtext { font-family: var(--display); font-weight: 700; font-size: clamp(21px, 5.6vw, 26px); line-height: 1.22; letter-spacing: -.02em; margin: 8px 0 4px; }
  .hint { font-size: 14px; color: var(--ink-soft); margin: 8px 0 14px; }

  .choice {
    display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
    border: 2px solid var(--grid); border-radius: 2px; padding: 13px 14px; margin: 9px 0; min-height: 52px;
  }
  .choice .key {
    flex: none; width: 26px; height: 26px; border: 2px solid currentColor; border-radius: 50%;
    display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px;
    color: var(--ink-soft);
  }
  .choice.sel { border-color: var(--ink); }
  .choice.sel .key { color: var(--ink); background: var(--hl); border-color: var(--ink); }
  .choice.ok { border-color: var(--green); background: var(--green-wash); }
  .choice.ok .key { color: var(--green); border-color: var(--green); background: none; }
  .choice.bad { border-color: var(--red); background: var(--red-wash); }
  .choice.bad .key { color: var(--red); border-color: var(--red); background: none; }
  .choice.bad .label { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
  .choice[disabled] { cursor: default; opacity: 1; }

  /* ---- eşleştirme ---- */
  .pair { display: flex; align-items: stretch; gap: 10px; margin: 10px 0; }
  .pair .left {
    flex: 1; padding: 12px 13px; border: 2px dashed var(--grid); border-right: 0; font-size: 15px;
    display: flex; align-items: center; background: none; color: var(--ink);
  }
  .pair .right {
    flex: 1; padding: 12px 13px; min-height: 52px; cursor: pointer; font-size: 15px; text-align: left;
    font-family: var(--body); color: var(--ink);
    background: var(--paper); border: 2px solid var(--grid); border-radius: 2px;
  }
  .pair .right.empty { color: var(--ink-soft); }
  .pair .right.active { border-color: var(--ink); background: var(--hl); color: #11161E; }
  .pair .right.filled { border-color: var(--ink); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .chip {
    padding: 11px 14px; min-height: 46px; cursor: pointer; font-family: var(--body); font-size: 15px; text-align: left;
    background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 2px;
  }
  .chip:active { transform: translate(1px, 1px); }
  .slot {
    min-height: 60px; padding: 9px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    border: 2px dashed var(--ink-soft); background: none;
  }
  .slot:empty::after { content: "Sırayı buraya kur"; color: var(--ink-soft); font-size: 14px; padding-left: 6px; }
  .slot .chip { border-style: solid; }
  .slot .chip .n { font-family: var(--display); font-weight: 700; color: var(--hl-text, var(--ink-soft)); margin-right: 7px; }

  /* ---- kaynak cümle kartı ve sesli dinleme ---- */
  .srccard {
    display: flex; align-items: center; gap: 12px;
    border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow);
    background: var(--paper); padding: 12px 14px; margin: 14px 0 8px;
    font-size: 17px; line-height: 1.4; font-weight: 500;
  }
  .srccard .txt { flex: 1; min-width: 0; }
  .speak {
    flex: none; width: 42px; height: 42px; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: var(--hl); color: #11161E;
    border: 2px solid var(--ink); border-radius: 50%; box-shadow: 2px 2px 0 var(--ink);
  }
  .speak:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
  .speak svg { width: 22px; height: 22px; display: block; }
  .verdictrow .speak { margin-left: auto; }

  /* ---- cümle kurma: kelime blokları ---- */
  /* cevap satırları defter çizgisi gibi; her blok sırası bir çizgiye oturur */
  .buildline {
    min-height: 116px; display: flex; flex-wrap: wrap; gap: 10px 8px; align-content: flex-start;
    padding: 4px 0 6px; margin: 8px 0 18px;
    background-image: repeating-linear-gradient(to bottom, transparent 0 53px, var(--ink-soft) 53px 55px, transparent 55px 56px);
  }
  .wbank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; margin: 6px 0 4px; }
  .wchip {
    min-height: 46px; padding: 9px 14px; cursor: pointer;
    font-family: var(--body); font-size: 16px; font-weight: 500; line-height: 1.2;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
  }
  .wchip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .wchip.used { background: var(--grid); border-color: var(--grid); color: transparent; box-shadow: none; cursor: default; }
  .buildline.ok .wchip { border-color: var(--green); background: var(--green-wash); box-shadow: 0 3px 0 var(--green); }
  .buildline.bad .wchip { border-color: var(--red); background: var(--red-wash); box-shadow: 0 3px 0 var(--red); }
  .wchip[disabled] { cursor: default; }

  /* ---- kutu eşleştirme ---- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 4px; }
  .tcol { display: flex; flex-direction: column; gap: 12px; }
  .tile {
    min-height: 66px; padding: 10px 8px; cursor: pointer;
    display: grid; place-items: center; text-align: center;
    font-family: var(--body); font-size: 16px; font-weight: 500; line-height: 1.25;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
    transition: background-color .15s ease, transform .1s ease;
  }
  .tile.big { font-size: 38px; line-height: 1; }
  .tile.sel { background: var(--hl); color: #11161E; transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
  .tile.done { border-color: var(--green); background: var(--green-wash); color: var(--green); box-shadow: 0 2px 0 var(--green); cursor: default; }
  .tile.done.big { opacity: .75; }
  .tile.err { border-color: var(--red); background: var(--red-wash); color: var(--red); box-shadow: 0 4px 0 var(--red); }
  @media (prefers-reduced-motion: no-preference) {
    .tile.err { animation: tileshake .35s ease; }
    .tile.done { animation: tilepop .3s ease; }
  }
  @keyframes tileshake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes tilepop { 50% { transform: scale(1.05); } }

  /* ---- alt çubuk ---- */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--paper); border-top: 2px solid var(--ink);
    padding-bottom: env(safe-area-inset-bottom);
  }
  footer .shell { padding-top: 12px; padding-bottom: 12px; }
  footer.ok { background: var(--green-wash); border-top-color: var(--green); }
  footer.bad { background: var(--red-wash); border-top-color: var(--red); }
  .verdictrow { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .verdictrow img { width: 58px; flex: none; }
  .verdict {
    font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -.02em;
    display: inline-block; transform: rotate(-2.2deg);
  }
  footer.ok .verdict { color: var(--green); }
  footer.bad .verdict { color: var(--red); }
  .answer { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .why { font-size: 14.5px; line-height: 1.45; color: var(--ink); margin-bottom: 12px; }
  footer .btn { margin: 0; }

  /* ---- sonuç ---- */
  .resultart { display: block; width: 136px; margin: 10px auto -4px; }
  .sign {
    text-align: right; font-family: var(--hand); font-weight: 700; font-size: 30px;
    color: var(--red); transform: rotate(-2deg); margin: 24px 0 0;
  }
  .grade { text-align: center; padding: 14px 0 4px; }
  .stamp { position: relative; display: inline-block; padding: 24px 54px; }
  .stamp .num {
    position: relative; z-index: 1; font-family: var(--display); font-weight: 800;
    font-size: 68px; line-height: 1; letter-spacing: -.04em; color: var(--red);
    display: block; transform: rotate(-4deg);
  }
  .stamp .ring {
    position: absolute; inset: -6px -10px;
    border: 2.6px solid var(--red); border-radius: 50%;
    transform: rotate(-5deg); transform-origin: 50% 50%;
  }
  /* daire çizili durur; çizilme animasyonunu JS ekler, hareket kapalıysa eklemez */
  .grade .note { margin-top: 18px; font-size: 15px; color: var(--ink-soft); }

  .review h2 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 26px 0 4px; }
  .miss { border-left: 3px solid var(--red); padding: 2px 0 2px 12px; margin: 16px 0; }
  .miss .q { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .miss .a { font-size: 14px; color: var(--red); margin-top: 3px; }
  .miss .e { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }
  .warn { color: var(--red); font-size: 14px; }

  /* ---- şekil ve tablo ---- */
  .fig { display: block; width: 100%; height: auto; margin: 12px auto 4px; overflow: visible; }
  .fig text { font-family: var(--body); text-anchor: middle; dominant-baseline: central; fill: var(--ink); }
  .fig .pt { font-family: var(--display); font-weight: 700; font-size: 14px; }
  .fig .ms { font-size: 13px; font-weight: 600; }
  .fig .msr { font-size: 13px; font-weight: 600; fill: var(--red); }
  .fig .sm, .fig .sml { font-size: 11px; fill: var(--ink-soft); }
  .fig .sml { text-anchor: start; }
  .fig .smw { font-size: 12px; font-weight: 600; fill: #fff; }
  .fig .smd { font-size: 12px; font-weight: 600; fill: #555; }
  .fig .ln { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .fig .lt { fill: none; stroke: var(--ink); stroke-width: 1.2; }
  .fig .lw { fill: none; stroke: var(--ink); stroke-width: 3.4; stroke-linecap: round; }
  .fig .ld { fill: none; stroke: var(--ink-soft); stroke-width: 1.4; stroke-dasharray: 4 3; }
  .fig .lc { fill: none; stroke: var(--red); stroke-width: 1.8; }
  .fig .lc2 { fill: none; stroke: var(--ink-soft); stroke-width: 1.2; stroke-dasharray: 3 3; }
  .fig .lg { stroke: var(--grid); stroke-width: 1; }
  .fig .lg2 { stroke: #5DBB4A; stroke-width: 3; }
  .fig .lpole { stroke: #7A5230; stroke-width: 4; stroke-linecap: round; }
  .fig .la { fill: none; stroke: var(--red); stroke-width: 1.5; }
  .fig .fa { fill: var(--hl); fill-opacity: .35; }
  .fig .fb { fill: var(--ink-soft); fill-opacity: .2; }
  .fig .fp { fill: #F4A7A7; }
  .fig .fn { fill: #3B4A6B; }
  .fig .fr { fill: #C9443E; }
  .fig .fw { fill: #FFFFFF; }
  .fig .fi { fill: var(--ink); }
  .fig .b1 { fill: #8A9AB0; }
  .fig .b2 { fill: #F2994A; }
  .tablewrap { overflow-x: auto; margin: 12px 0 4px; }
  .dtable { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 100%; }
  .dtable th, .dtable td { border: 1.5px solid var(--ink-soft); padding: 6px 8px; text-align: center; }
  .dtable th { background: var(--grid); font-weight: 600; }
  .dtable td:first-child { font-weight: 600; text-align: left; }
  .dtable td:empty::after { content: "?"; color: var(--ink-soft); }

  /* ---- konu listesi: anlatım düğmesi ---- */
  .unitrow { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--grid); }
  .unitrow .unit { border-bottom: 0; flex: 1; min-width: 0; }
  .lessonbtn {
    flex: none; cursor: pointer; text-align: center;
    font-family: var(--body); font-size: 13px; font-weight: 600; line-height: 1.15;
    background: var(--hl); color: #11161E;
    border: 2px solid var(--ink); border-radius: 2px; box-shadow: 2px 2px 0 var(--ink);
    padding: 8px 10px; min-height: 44px;
  }
  .lessonbtn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }

  /* ---- konu anlatımı ---- */
  .lessontitle { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 6.6vw, 30px); line-height: 1.1; letter-spacing: -.02em; margin: 4px 0 0; }
  .lcard {
    border: 2px solid var(--ink); border-radius: 2px; box-shadow: var(--shadow);
    background: var(--paper); padding: 14px 16px 12px; margin: 14px 0 8px;
  }
  .lcard h2 { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; margin: 0 0 8px; }
  .lcard p { margin: 0 0 10px; }
  .lcard ul { margin: 0 0 10px; padding-left: 20px; }
  .lcard li { margin: 4px 0; }
  .formula {
    font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.5;
    background: var(--hl); color: #11161E; padding: 8px 12px; margin: 10px 0; border-radius: 2px;
  }
  .tip { border-left: 3px solid var(--red); padding: 2px 0 2px 10px; margin: 10px 0 4px; font-size: 15px; }
  .tip b { color: var(--red); }

  /* ---- alt çubuk düğme sırası ve boş bırakma ---- */
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { margin: 0; }
  .btnrow .btn.side { flex: 0 0 36%; }
  .btnrow .btn.main { flex: 1; }
  footer.skip { background: var(--grid); border-top-color: var(--ink-soft); }
  footer.skip .verdict { color: var(--ink-soft); }
  .miss.skipped { border-left-color: var(--ink-soft); }
  .miss .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 0 6px; margin-bottom: 3px; border: 1.5px solid currentColor; border-radius: 2px; }

  /* ---- maskot: Mikey ---- */
  /* tüm ruh hâlleri tek SVG'de durur; data-mood hangisinin görüneceğini seçer */
  .buddy { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; }

  .mikey .rig, .mikey .head, .mikey .eye, .mikey .arm, .mikey .tear, .mikey .spark, .mikey .shadow {
    transform-box: fill-box; transform-origin: 50% 50%;
  }
  .mikey .rig { transform-origin: 50% 100%; }
  .mikey .head { transform-origin: 50% 100%; }
  .mikey .arm.l { transform-origin: 100% 100%; }
  .mikey .arm.r { transform-origin: 0% 100%; }
  /* kollar ruh hâline göre duruş alır; animasyon kapalıyken de görünür */
  .mikey[data-mood="happy"] .arm.l { transform: rotate(28deg); }

  .mikey .v-happy, .mikey .v-sad, .mikey .v-think { display: none; }
  .mikey[data-mood="happy"] .v-idle, .mikey[data-mood="sad"] .v-idle, .mikey[data-mood="think"] .v-idle { display: none; }
  .mikey[data-mood="happy"] .v-happy, .mikey[data-mood="sad"] .v-sad, .mikey[data-mood="think"] .v-think { display: inline; }
  .mikey[data-mood="happy"] .blush { opacity: .85; }

  @media (prefers-reduced-motion: no-preference) {
    .mikey .rig { animation: mikey-sway 3.2s ease-in-out infinite; }
    .mikey .eye { animation: mikey-blink 4.4s infinite; }

    .mikey[data-mood="happy"] .rig { animation: mikey-hop .75s cubic-bezier(.3,.7,.4,1) 2; }

  }
  @keyframes mikey-sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes mikey-blink { 0%, 92%, 100% { transform: none; } 95% { transform: scaleY(.1); } }
  @keyframes mikey-tilt { from { transform: rotate(-3deg); } to { transform: rotate(-10deg); } }
  @keyframes mikey-hop {
    0% { transform: none; } 18% { transform: scale(1.05, .92); }
    45% { transform: translateY(-15px) scale(.97, 1.04); } 75% { transform: scale(1.03, .95); } 100% { transform: none; }

  @keyframes mikey-shadow { 0%, 100% { transform: none; } 45% { transform: scale(.6); opacity: .5; } }
  @keyframes mikey-wave-l { from { transform: rotate(10deg); } to { transform: rotate(42deg); } }

  @keyframes mikey-slump { to { transform: translateY(3px) scaleY(.97); } }

  /* ---- sınıf sayfaları: hesap satırı ve sekmeler ---- */

  /* sekmeler yazılarına göre genişler, kalan yer paylaşılır: "Zamanlayıcı" dar ekranda da kesilmez */

  }

    margin: 22px 0 8px;
  }

  .lb .nm { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
  .lb .val { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- ödevler ---- */
  .minibtn {

<body>
<div id="intro">
  <img src="img/capy-circle.png" alt="ahmojunior">
</div>
<main id="app"></main>
<footer id="foot" hidden><div class="shell" id="footinner"></div></footer>

<script>
"use strict";

const SUBJECTS = [
  { key: "bio", name: "Biyoloji",  file: "questions-bio.json", lessons: "lessons-bio.json" },
  { key: "kim", name: "Kimya",     file: "questions-kim.json", lessons: "lessons-kim.json" },
  { key: "mat", name: "Matematik", file: "questions-mat.json", lessons: "lessons-mat.json" },
  { key: "alm", name: "Almanca",   file: "questions-alm.json", lessons: "lessons-alm.json", lang: "de-DE" }
];
const ROUND_SIZE = 10;
const KEYS = ["a", "b", "c", "d", "e"];

const app = document.getElementById("app");
const foot = document.getElementById("foot");
const footinner = document.getElementById("footinner");

let banks = {};
let lessons = {};
let loadErrors = [];
let state = null;

/* ---------- kalıcı ilerleme ---------- */

const STORE_KEY = "yazili-antrenman-v1";
let store = { q: {}, day: null, rounds: 0 };

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) store = Object.assign(store, JSON.parse(raw));
  } catch (e) { /* depolama kapalı: ilerleme tutulmaz */ }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
function today() { return new Date().toISOString().slice(0, 10); }
function touchDay() {
  const d = today();
  if (store.day === d) return;
  store.day = d;
  store.rounds = 0;
  saveStore();
}
function stat(id) { return store.q[id] || { c: 0, w: 0 }; }
function record(id, correct) {
  const s = store.q[id] || { c: 0, w: 0 };
  if (correct) s.c++; else s.w++;
  store.q[id] = s;
  saveStore();
}
// boş bırakılan soru doğruluk yüzdesini etkilemez, ama sonraki turlarda daha sık gelir
function recordSkip(id) {
  const s = store.q[id] || { c: 0, w: 0 };
  s.s = (s.s || 0) + 1;
  store.q[id] = s;
  saveStore();
}

/* ---------- veri yükleme ve doğrulama ---------- */

function validate(q, i, key) {
  const where = key + "[" + i + "] " + (q && q.id ? q.id : "");
  const bad = (m) => { loadErrors.push(where + ": " + m); return false; };
  if (!q || typeof q !== "object") return bad("nesne değil");
  if (!q.id || !q.q || !q.why || !q.unit) return bad("id/q/why/unit eksik");
  if (q.type === "mc" || q.type === "fill") {
    if (!Array.isArray(q.choices) || q.choices.length < 2) return bad("choices eksik");
    if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= q.choices.length) return bad("answer index geçersiz");
  } else if (q.type === "tf") {
    if (typeof q.answer !== "boolean") return bad("answer boolean değil");
  } else if (q.type === "match") {
    if (!Array.isArray(q.pairs) || q.pairs.length < 2) return bad("pairs eksik");
    if (q.pairs.some(p => !Array.isArray(p) || p.length !== 2)) return bad("pair biçimi bozuk");
  } else if (q.type === "tiles") {
    if (!Array.isArray(q.pairs) || q.pairs.length < 2) return bad("pairs eksik");
    if (q.pairs.some(p => !Array.isArray(p) || p.length !== 2)) return bad("pair biçimi bozuk");
  } else if (q.type === "order") {
    if (!Array.isArray(q.items) || q.items.length < 2) return bad("items eksik");
  } else if (q.type === "build") {
    const words = (a) => Array.isArray(a) && a.length > 0 && a.every(w => typeof w === "string" && w);
    if (!words(q.words) || q.words.length < 2) return bad("words eksik");
    if (q.extra != null && !(Array.isArray(q.extra) && (!q.extra.length || words(q.extra)))) return bad("extra biçimi bozuk");
    if (q.alt != null && !(Array.isArray(q.alt) && q.alt.every(words))) return bad("alt biçimi bozuk");
  } else {
    return bad("bilinmeyen type: " + q.type);
  }
  if (q.fig && !validFig(q.fig)) return bad("fig biçimi bozuk");
  if (q.table && !validTable(q.table)) return bad("table biçimi bozuk");
  return true;
}
function validFig(f) {
  return f && typeof f === "object" && f.w > 0 && f.h > 0 && Array.isArray(f.e);
}
function validTable(t) {
  return t && Array.isArray(t.h) && Array.isArray(t.r) && t.r.every(Array.isArray);
}

async function loadBanks() {
  for (const s of SUBJECTS) {
    try {
      const res = await fetch(s.file, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      banks[s.key] = data.filter((q, i) => validate(q, i, s.key));
    } catch (e) {
      banks[s.key] = [];
      loadErrors.push(s.name + " yüklenemedi: " + e.message);
    }
    // konu anlatımı isteğe bağlıdır: dosya yoksa düğme görünmez
    try {
      const res = await fetch(s.lessons, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      lessons[s.key] = {};
      for (const unit in data) {
        const steps = (data[unit] || []).filter(st => st && st.title && st.say &&
          (!st.fig || validFig(st.fig)) && (!st.table || validTable(st.table)));
        if (steps.length) lessons[s.key][unit] = steps;
      }
    } catch (e) {
      lessons[s.key] = {};
      loadErrors.push(s.name + " konu anlatımı yüklenemedi: " + e.message);
    }
  }
  if (loadErrors.length) console.warn("Soru bankası uyarıları:\n" + loadErrors.join("\n"));
}

/* ---------- yardımcılar ---------- */

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function el(tag, props, kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === "class") n.className = props[k];
    else if (k === "text") n.textContent = props[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), props[k]);
    else if (props[k] === true) n.setAttribute(k, "");
    else if (props[k] !== false && props[k] != null) n.setAttribute(k, props[k]);
  }
  (kids || []).forEach(c => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}
function highlight(text) {
  return el("span", { class: "hl" }, [text]);
}
function units(key) {
  const m = new Map();
  for (const q of banks[key]) {
    const u = m.get(q.unit) || { name: q.unit, n: 0, c: 0, w: 0 };
    const s = stat(q.id);
    u.n++; u.c += s.c; u.w += s.w;
    m.set(q.unit, u);
  }
  return [...m.values()];
}
function pct(u) {
  const t = u.c + u.w;
  return t ? Math.round(100 * u.c / t) : null;
}
function setSubject(key) {
  if (key) document.body.dataset.subject = key;
  else delete document.body.dataset.subject;
}

/* ---------- sesli dinleme ---------- */

// tarayıcının konuşma sentezi; destek yoksa dinleme düğmesi hiç görünmez
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance === "function";
function speak(text, lang) {
  if (!canSpeak || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    const base = lang.slice(0, 2).toLowerCase();
    const voice = speechSynthesis.getVoices().find(v => (v.lang || "").toLowerCase().startsWith(base));
    if (voice) u.voice = voice;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) { /* ses kapalı ya da desteklenmiyor */ }
}
const SPEAK_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
function speakButton(text, lang) {
  if (!canSpeak || !lang || !text) return null;

// fig: {w, h, e: [komut]}; komutlar soru bankasını üreten betikte hesaplanır
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function renderFig(f) {
  const svg = svgEl("svg", { class: "fig", viewBox: (f.x || 0) + " " + (f.y || 0) + " " + f.w + " " + f.h, role: "img", "aria-label": "Şekil" });
  svg.style.maxWidth = Math.round(f.w * 1.25) + "px";
  for (const op of f.e) {
    const [k] = op;
    if (k === "l") svg.appendChild(svgEl("line", { x1: op[1], y1: op[2], x2: op[3], y2: op[4], class: op[5] }));
    else if (k === "pg") svg.appendChild(svgEl("polygon", { points: op[1], class: op[2] }));
    else if (k === "p") svg.appendChild(svgEl("path", { d: op[1], class: op[2] }));
    else if (k === "c") svg.appendChild(svgEl("circle", { cx: op[1], cy: op[2], r: op[3], class: op[4] }));
    else if (k === "r") svg.appendChild(svgEl("rect", { x: op[1], y: op[2], width: op[3], height: op[4], class: op[5] }));
    else if (k === "t") svg.appendChild(svgEl("text", { x: op[1], y: op[2], class: op[4] }, op[3]));
  }
  return svg;
}
function renderTable(t) {
  const head = el("tr", {}, t.h.map(c => el("th", { text: c })));
  const rows = t.r.map(r => el("tr", {}, r.map(c => el("td", { text: c }))));
  return el("div", { class: "tablewrap" }, [el("table", { class: "dtable" }, [el("thead", {}, [head]), el("tbody", {}, rows)])]);
}
function appendMedia(parent, item) {
  if (item.fig) parent.appendChild(renderFig(item.fig));
  if (item.table) parent.appendChild(renderTable(item.table));
}

/* ---------- tur seçimi ---------- */

function pickQuestions(key, unit) {
  let pool = banks[key].filter(q => !unit || q.unit === unit);
  if (!pool.length) return [];
  // ağırlık: yanlış ya da hiç doğru yapılmadan boş bırakılanlar 3x, hiç görülmemiş 2x, bilinenler 1x
  const weighted = [];
  for (const q of pool) {
    const s = stat(q.id);
    let w = 1;
    if (s.w > s.c || (s.s && !s.c)) w = 3;
    else if (s.c + s.w + (s.s || 0) === 0) w = 2;
    for (let i = 0; i < w; i++) weighted.push(q);
  }
  const picked = [];
  const seen = new Set();
  for (const q of shuffle(weighted)) {
    if (seen.has(q.id)) continue;
    seen.add(q.id);
    picked.push(q);
    if (picked.length === ROUND_SIZE) break;
  }
  return picked;
}

function startRound(key, unit, fixedList) {
  const list = fixedList && fixedList.length ? shuffle(fixedList) : pickQuestions(key, unit);
  if (!list.length) { renderSubject(key); return; }
  touchDay();
  state = { key, unit, list, i: 0, correct: 0, wrong: [], skipped: [], answered: false, sel: null, streak: 0, buddy: null };
  renderQuestion();
}

  else if (q.type === "tiles") renderTiles(body, q);
  else if (q.type === "order") renderOrder(body, q);
  else if (q.type === "build") renderBuild(body, q);

  setFooterCheck();

function refreshCheck() {
  const btn = document.getElementById("checkbtn");
  if (!btn) return;
  btn.disabled = !hasAnswer();
  btn.style.opacity = btn.disabled ? ".45" : "1";
  // cevap ilk kez tamamlandığında Mikey düşünmeye başlar
  if (!btn.disabled && state.buddy && state.buddy.mood() === "idle") state.buddy.say("think", mikeyLine("think"));
}
function hasAnswer() {
  const q = state.list[state.i];
  const s = state.sel;
  if (q.type === "mc" || q.type === "fill" || q.type === "tf") return s !== null && s !== undefined;
  if (q.type === "match") return s && s.map && q.pairs.every((_, i) => s.map[i] != null);
  if (q.type === "order") return s && s.placed && s.placed.length === q.items.length;
  if (q.type === "build") return s && s.placed && s.placed.length > 0;
  if (q.type === "tiles") return s && s.done === q.pairs.length;
  return false;
}

function choiceButton(body, label, key, value) {
  const b = el("button", { class: "choice", onclick: () => {
    if (state.answered) return;
    state.sel = value;
    [...body.querySelectorAll(".choice")].forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    refreshCheck();
  } }, [
    el("span", { class: "key", text: key }),
    el("span", { class: "label", text: label })
  ]);
  body.appendChild(b);
  return b;
}

function renderChoices(body, q) {
  shuffle(q.choices.map((c, i) => i)).forEach((idx, pos) => {
    const b = choiceButton(body, q.choices[idx], KEYS[pos], idx);
    b.dataset.idx = idx;
  });
}

function renderTF(body, q) {
  [["Doğru", true, "D"], ["Yanlış", false, "Y"]].forEach(([label, val, k]) => {
    const b = choiceButton(body, label, k, val);
    b.dataset.val = String(val);
  });
}

function renderMatch(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Soldakine karşılık gelen kutuya dokun, sonra doğru eşini seç." }));
  const rights = shuffle(q.pairs.map((p, i) => ({ text: p[1], i })));
  state.sel = { map: {}, pending: null };

  const slots = [];
  q.pairs.forEach((p, li) => {
    const right = el("button", { class: "right empty", text: "seç", onclick: () => {
      if (state.answered) return;
      state.sel.pending = state.sel.pending === li ? null : li;
      redraw(); drawPicker();
    } });
    body.appendChild(el("div", { class: "pair" }, [
      el("div", { class: "left", text: p[0] }),
      right
    ]));
    slots.push({ right, li });
  });

  const picker = el("div", { class: "chips" }, []);
  body.appendChild(picker);

  function redraw() {
    slots.forEach(({ right, li }) => {
      const r = state.sel.map[li];
      right.textContent = r == null ? "seç" : q.pairs[r][1];
      right.className = "right" + (r == null ? " empty" : " filled") + (state.sel.pending === li ? " active" : "");
    });
  }
  function drawPicker() {
    picker.innerHTML = "";
    if (state.sel.pending == null) return;
    const used = new Set(Object.values(state.sel.map));
    rights.forEach(r => {
      if (used.has(r.i) && state.sel.map[state.sel.pending] !== r.i) return;
      picker.appendChild(el("button", { class: "chip", text: r.text, onclick: () => {
        if (state.answered) return;
        state.sel.map[state.sel.pending] = r.i;
        state.sel.pending = null;
        picker.innerHTML = "";
        redraw();
        refreshCheck();
      } }));
    });
  }
  state.sel.redraw = redraw;
  redraw();
}

function renderOrder(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Doğru sırayla dokun. Kaldırmak için üstteki kutudan dokun." }));
  const slot = el("div", { class: "slot" }, []);
  const pool = el("div", { class: "chips" }, []);
  body.appendChild(slot);
  body.appendChild(pool);
  state.sel = { placed: [] };

  const shuffled = shuffle(q.items.map((t, i) => ({ t, i })));
  function draw() {
    slot.innerHTML = "";
    state.sel.placed.forEach((it, pos) => {
      const c = el("button", { class: "chip", onclick: () => {
        if (state.answered) return;
        state.sel.placed.splice(pos, 1);
        draw(); refreshCheck();
      } }, []);
      c.appendChild(el("span", { class: "n", text: (pos + 1) }));
      c.appendChild(document.createTextNode(it.t));
      slot.appendChild(c);
    });
    pool.innerHTML = "";
    const used = new Set(state.sel.placed.map(p => p.i));
    shuffled.forEach(it => {
      if (used.has(it.i)) return;
      pool.appendChild(el("button", { class: "chip", text: it.t, onclick: () => {
        if (state.answered) return;
        state.sel.placed.push(it);
        draw(); refreshCheck();
      } }));
    });
  }
  state.sel.draw = draw;
  draw();
}

// kutu eşleştirme: iki sütun karışık dizilir; bir kutuya, sonra karşı sütundaki eşine dokunulur.
// doğru eş anında yeşile döner, yanlış eş kırmızı sallanır ve hata sayılır; hepsi bulununca cevap kendiliğinden kontrol edilir
const EMOJI_ONLY = /^[\p{Extended_Pictographic}‍️\s]+$/u;
function renderTiles(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Bir kutuya, sonra karşı sütundaki eşine dokun." }));
  state.sel = { done: 0, mistakes: 0, pick: null };
  const sel = state.sel;
  const cols = [el("div", { class: "tcol" }, []), el("div", { class: "tcol" }, [])];
  body.appendChild(el("div", { class: "tiles" }, cols));

  [0, 1].forEach(side => {
    shuffle(q.pairs.map(p => p[side])).forEach(t => {
      const it = { t, side };
      it.b = el("button", { class: "tile" + (EMOJI_ONLY.test(t) ? " big" : ""), text: t, onclick: () => tap(it) });
      if (EMOJI_ONLY.test(t)) it.b.setAttribute("aria-label", "Resim: " + t);
      cols[side].appendChild(it.b);
    });
  });

  function tap(it) {
    if (state.answered || state.sel !== sel || it.b.disabled) return;
    const p = sel.pick;
    if (!p || p.side === it.side) {
      if (p) p.b.classList.remove("sel");
      sel.pick = p === it ? null : it;
      if (sel.pick) it.b.classList.add("sel");
      return;
    }
    sel.pick = null;
    p.b.classList.remove("sel");
    const l = p.side === 0 ? p : it, r = p.side === 0 ? it : p;
    // metne göre karşılaştır: aynı metni taşıyan iki kutudan hangisi seçilirse seçilsin doğru sayılır
    const ok = q.pairs.some(pr => pr[0] === l.t && pr[1] === r.t);
    if (ok) {
      [l, r].forEach(x => { x.b.classList.add("done"); x.b.disabled = true; });
      sel.done++;
      if (sel.done === q.pairs.length) {
        refreshCheck();
        setTimeout(() => { if (state && state.sel === sel && !state.answered) submit(); }, 450);
      }
    } else {
      sel.mistakes++;
      [l, r].forEach(x => {
        x.b.classList.remove("err");
        void x.b.offsetWidth;
        x.b.classList.add("err");
        setTimeout(() => x.b.classList.remove("err"), 600);
      });
    }
  }
}

// cümle kurma: bankadaki kelime bloklarına dokunarak cevap satırına dizilir.
// kullanılan bloğun yeri bankada boş kalır, böylece bloklar kaymaz; satırdaki bloğa dokununca geri döner
function renderBuild(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Kelimelere sırayla dokun. Geri almak için satırdaki kelimeye dokun." }));
  const line = el("div", { class: "buildline", "aria-label": "Cevap satırı" }, []);
  const bank = el("div", { class: "wbank" }, []);
  body.appendChild(line);
  body.appendChild(bank);
  state.sel = { placed: [] };
  const sel = state.sel;
  const tokens = shuffle(q.words.concat(q.extra || []).map((t, i) => ({ t, i })));

  function draw() {
    line.innerHTML = "";
    sel.placed.forEach((it, pos) => {
      line.appendChild(el("button", { class: "wchip", text: pos === 0 ? capFirst(it.t) : it.t, onclick: () => {
        if (state.answered) return;
        sel.placed.splice(pos, 1);
        draw(); refreshCheck();
      } }));
    });
    bank.innerHTML = "";
    const used = new Set(sel.placed.map(p => p.i));
    tokens.forEach(it => {
      if (used.has(it.i)) {
        bank.appendChild(el("span", { class: "wchip used", "aria-hidden": "true", text: it.t }));
        return;
      }
      bank.appendChild(el("button", { class: "wchip", text: it.t, onclick: () => {
        if (state.answered) return;
        sel.placed.push(it);
        draw(); refreshCheck();
      } }));
    });
  }
  draw();
}
// isim olmayan bloklar veride küçük harfle durur; cümlenin başına gelen blok büyük harfle gösterilir
function capFirst(t) { return t ? t.charAt(0).toLocaleUpperCase("de") + t.slice(1) : t; }
function buildSentence(words) { return capFirst(words.join(" ")); }
// karşılaştırmada büyük/küçük harf ve noktalama yok sayılır; bloklar sabit olduğu için yalnızca sıra önemlidir
function normSentence(words) {
  return words.join(" ").toLocaleLowerCase("de").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ").trim();
}

/* ---------- cevap kontrolü ---------- */

function isCorrect(q) {
  const s = state.sel;
  if (q.type === "mc" || q.type === "fill" || q.type === "tf") return s === q.answer;
  // metne göre karşılaştır: aynı karşılığı taşıyan iki çift (ör. iki "Fiziksel") de doğru sayılsın
  if (q.type === "match") return q.pairs.every((p, i) => q.pairs[s.map[i]][1] === p[1]);
  if (q.type === "order") return s.placed.every((p, i) => p.i === i);
  if (q.type === "tiles") return s.mistakes === 0;
  if (q.type === "build") {
    const got = normSentence(s.placed.map(p => p.t));
    return [q.words].concat(q.alt || []).some(a => normSentence(a) === got);
  }
  return false;
}

function correctText(q) {
  if (q.type === "mc" || q.type === "fill") return q.choices[q.answer];
  if (q.type === "tf") return q.answer ? "Doğru" : "Yanlış";
  if (q.type === "match" || q.type === "tiles") return q.pairs.map(p => p[0] + " = " + p[1]).join(", ");
  if (q.type === "order") return q.items.map((t, i) => (i + 1) + ". " + t).join("  ");
  if (q.type === "build") return buildSentence(q.words);
  return "";
}

function submit() {
  if (state.answered || !hasAnswer()) return;
  const q = state.list[state.i];
  state.answered = true;
  const ok = isCorrect(q);
  record(q.id, ok);
  if (ok) countCorrect();
  if (ok) { state.correct++; state.streak++; }
  else { state.wrong.push(q); state.streak = 0; }
  if (state.buddy) {
    state.buddy.say(ok ? "happy" : "sad",
      ok ? (state.streak >= 3 ? state.streak + " doğru üst üste!" : mikeyLine("happy")) : mikeyLine("sad"));
  }

  revealChoices(q);
  showVerdict(q, ok ? "ok" : "bad");
}

// seçenekli sorularda doğru seçeneği yeşil, işaretlenen yanlışı kırmızı gösterir
function revealChoices(q) {
  if (q.type === "mc" || q.type === "fill") {
    app.querySelectorAll(".choice").forEach(b => {
      const idx = Number(b.dataset.idx);
      b.disabled = true;
      b.classList.remove("sel");
      if (idx === q.answer) b.classList.add("ok");
      else if (idx === state.sel) b.classList.add("bad");
    });
  } else if (q.type === "tf") {
    app.querySelectorAll(".choice").forEach(b => {
      const val = b.dataset.val === "true";
      b.disabled = true;
      b.classList.remove("sel");
      if (val === q.answer) b.classList.add("ok");
      else if (val === state.sel) b.classList.add("bad");
    });
  } else if (q.type === "build") {
    app.querySelectorAll(".wchip").forEach(b => { b.disabled = true; });
    const line = app.querySelector(".buildline");
    if (line && state.sel) line.classList.add(isCorrect(q) ? "ok" : "bad");
  } else if (q.type === "tiles") {
    app.querySelectorAll(".tile").forEach(b => { b.disabled = true; b.classList.remove("sel"); });
  }
}

function showVerdict(q, kind) {
  const look = {
    ok:   ["img/capy-flex.png", "Doğru"],
    bad:  ["img/capy-hat.png", "Yanlış"],
    skip: ["img/capy-circle.png", "Boş bıraktın"]
  }[kind];
  foot.className = kind;
  footinner.innerHTML = "";
  const row = el("div", { class: "verdictrow" }, [
    el("img", { src: look[0], alt: "", "aria-hidden": "true" }, []),
    el("div", { class: "verdict", text: look[1] })
  ]);
  // kurulan cümlenin doğrusu dersin dilinde dinlenebilir
  const sp = q.type === "build" ? speakButton(buildSentence(q.words), subjectLang(state.key)) : null;
  if (sp) row.appendChild(sp);
  footinner.appendChild(row);
  if (kind === "bad" && q.type === "tiles" && state.sel) {
    footinner.appendChild(el("div", { class: "answer", text: state.sel.mistakes + " hatalı eşleştirme denedin. Doğrusu: " + correctText(q) }));
  } else if (kind !== "ok") {
    footinner.appendChild(el("div", { class: "answer", text: "Doğru cevap: " + correctText(q) }));
  }
  footinner.appendChild(el("div", { class: "why", text: q.why }));
  footinner.appendChild(el("button", { class: "btn solid", onclick: nextQuestion }, [
    state.i + 1 < state.list.length ? "Devam" : "Turu bitir"
  ]));
  footinner.querySelector(".btn").focus({ preventScroll: true });
}

function skipQuestion() {
  if (state.answered) return;
  const q = state.list[state.i];
  state.answered = true;
  state.sel = null;
  state.skipped.push(q);
  state.streak = 0;
  recordSkip(q.id);
  if (state.buddy) state.buddy.say("think", mikeyLine("skip"));
  revealChoices(q);
  showVerdict(q, "skip");
}

function nextQuestion() {
  state.i++;
  if (state.i >= state.list.length) renderResult();
  else renderQuestion();
}

/* ---------- tur sonu ---------- */

function renderResult() {
  store.rounds = (store.rounds || 0) + 1;
  saveStore();
  foot.hidden = true;
  app.innerHTML = "";
  app.appendChild(topbar(() => renderSubject(state.key)));

  const n = state.list.length;
  const wrongCount = state.wrong.length;
  const skipCount = state.skipped.length;
  const missCount = wrongCount + skipCount;
  app.appendChild(el("img", {
    class: "resultart", alt: "", "aria-hidden": "true",
    src: missCount === 0 ? "img/capy-hands.png" : "img/capy-flex.png"
  }, []));
  const stamp = el("div", { class: "stamp" }, [
    el("div", { class: "ring", "aria-hidden": "true" }, []),
    el("div", { class: "num", text: state.correct + "/" + n })
  ]);
  app.appendChild(el("div", { class: "grade" }, [
    stamp,
    el("p", { class: "note", text: missCount === 0 ? "Hepsi doğru."
      : [wrongCount ? wrongCount + " yanlış" : "", skipCount ? skipCount + " boş" : ""].filter(Boolean).join(", ") + "; aşağıda duruyorlar." })
  ]));
  const ratio = state.correct / n;
  const [mood, line] =
    missCount === 0 ? ["happy", "Mükemmel, hepsi doğru!"]
    : ratio >= 0.7 ? ["happy", "Çok iyiydi, böyle devam!"]
    : ratio >= 0.4 ? ["think", "Fena değil, yanlışlara bakalım."]
    : ["sad", "Olsun, tekrar edince oturacak."];
  app.appendChild(buddy(mood, line, "resultbuddy").row);
  // turun tek animasyonu: daire kalemle çizilmiş gibi oturur
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    stamp.querySelector(".ring").animate(
      [
        { transform: "scale(.7) rotate(-14deg)", opacity: 0 },
        { transform: "rotate(-5deg)", opacity: 1 }
      ],
      { duration: 480, delay: 120, easing: "cubic-bezier(.2,1.5,.4,1)", fill: "backwards" }
    );
  }

  const key = state.key, unit = state.unit;

  if (missCount) {
    // kaçırılanlar turdaki sırasıyla: yanlışlar ve boşlar birlikte
    const misses = state.list.filter(q => state.wrong.includes(q) || state.skipped.includes(q));
    app.appendChild(el("button", { class: "btn solid", onclick: () => startRound(key, unit, misses) }, [
      skipCount && !wrongCount ? "Boşları tekrar et" : skipCount ? "Yanlış ve boşları tekrar et" : "Yanlışları tekrar et"
    ]));
    const box = el("div", { class: "review" }, [el("h2", { text: "Kaçırdıkların" })]);
    misses.forEach(q => {
      const skipped = state.skipped.includes(q);
      box.appendChild(el("div", { class: "miss" + (skipped ? " skipped" : "") }, [
        el("span", { class: "tag " + (skipped ? "s" : "w"), text: skipped ? "Boş" : "Yanlış" }),
        el("div", { class: "q", text: q.src ? q.q + " " + q.src : q.q }),
        el("div", { class: "a", text: correctText(q) }),
        el("div", { class: "e", text: q.why })
      ]));
    });
    app.appendChild(box);
    app.appendChild(el("button", { class: "btn", onclick: () => startRound(key, unit) }, ["Yeni tur"]));
  } else {
    app.appendChild(el("button", { class: "btn solid", onclick: () => startRound(key, unit) }, ["Yeni tur"]));
  }
  app.appendChild(el("button", { class: "btn ghost", onclick: () => renderSubject(key) }, ["Konulara dön"]));
  app.appendChild(el("p", { class: "sign", text: "ahmojunior" }));
}

const PERM_ERR = "Bunun için iznin yok. Hesabın sınıf listesinde olmayabilir, ahmojunior ile iletişime geç.";
const NOT_LISTED = "Hesabın sınıf listesinde görünmüyor, bu yüzden süren ve doğruların kaydedilemiyor. ahmojunior ile iletişime geç.";
const SAVE_EVERY_MS = 2 * 60 * 1000;

const TASK_KEEP_DAYS = 7;

let cloudFailed = false;   // Firebase yüklenemedi ya da zamanında gelmedi

let authReadyResolve;
const authReady = new Promise(r => { authReadyResolve = r; });
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, reject) => setTimeout(() =>
    reject(Object.assign(new Error("zaman aşımı"), { code: "timeout" })), ms))]);
}
function errCode(e) { return (e && (e.code || e.name)) || "bilinmiyor"; }
function errMessage(e) { return e && e.code === "permission-denied" ? PERM_ERR : NET_ERR; }
function errbox(text) { return el("p", { class: "errbox", role: "alert", text }); }

/* ---------- Firebase bağlantısı ---------- */

window.capiCloudReady = (api) => {
  cloud = api;
  cloudFailed = false;
  try { api.onAuth(handleAuth); }
  catch (e) { cloud = null; cloudFail(e); }
};
window.capiCloudFailed = (e) => cloudFail(e);
function cloudFail() {
  if (cloud) return;
  cloudFailed = true;
  authReadyResolve();
  if (started) refreshView();
}
// modül hiç cevap vermezse (ağ çok yavaş, betik engellendi) misafir moduna geçilir; sonradan gelirse yine bağlanır
setTimeout(() => { if (!cloud) cloudFail(); }, 10000);

function idFromEmail(email) {
  const m = /^([a-z0-9]{1,40})@capi-study\.app$/.exec(String(email || "").toLowerCase());
  return m ? m[1] : null;
}
function handleAuth(user) {
  const id = user ? idFromEmail(user.email) : null;
  const first = !authKnown;
  authKnown = true;
  authReadyResolve();
  if ((me ? me.id : null) === id) { if (first && started) refreshView(); return; }
  timerCommit(); // önceki hesabın (ya da misafirin) süresi yeni hesaba yazılmaz
  timer.carryMs = 0;
  myStats = null;
  if (id) {
    const r = roster.byId.get(id);
    me = { id, alias: r ? r.alias : id, admin: false, member: null };
    forgetGuest();
    checkMembership();
  } else {
    me = null;
  }
  if (started) refreshView();
}
// Firestore'daki sınıf listesi kuralların kaynağıdır: takma ad ve yönetici bilgisi oradan okunur
let membershipCheck = null;
function checkMembership() {
  if (!cloud || !me) return Promise.resolve();
  if (membershipCheck) return membershipCheck;
  const who = me;
  membershipCheck = (async () => {
    try {
      const s = await withTimeout(cloud.getStudent(who.id), 15000);
      if (s) Object.assign(who, { alias: s.alias || who.alias, admin: s.admin, member: true });
      else who.member = false;
    } catch (e) {
      who.member = e && e.code === "permission-denied" ? false : null;
      if (who.member === null) console.warn("Sınıf listesi kontrol edilemedi, sonra yeniden denenecek:", errCode(e));
    }
    membershipCheck = null;
    if (me !== who) return;
    if (who.member) flushStats();
    refreshChrome();
    paintMemberWarn();
    updateTimerViews();
  })();
  return membershipCheck;
}

/* ---------- sınıf listesi (students.json) ---------- */

// takma addan kimlik: Türkçe küçük harf, ç ğ ı ö ş ü → c g i o s u, kalan aksanlar atılır, yalnızca a-z ve 0-9 kalır.
// "Çağlar", "çağlar" ve "CAGLAR" hepsi "caglar" olur
const TR_ASCII = { "ç": "c", "ğ": "g", "ı": "i", "ö": "o", "ş": "s", "ü": "u" };
function aliasToId(alias) {
  return String(alias == null ? "" : alias)
    .toLocaleLowerCase("tr")
    .replace(/[çğıöşü]/g, c => TR_ASCII[c])
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]/g, "");
}
function parseRoster(data) {
  const list = [], byId = new Map();
  const arr = data && Array.isArray(data.students) ? data.students : null;
  if (!arr) {
    console.error('students.json: "students" dizisi bulunamadı.');
    return { list, byId };
  }
  arr.forEach((s, i) => {
    const alias = s && typeof s.alias === "string" ? s.alias.trim() : "";
    const id = aliasToId(alias);
    if (!id) { console.error(`students.json[${i}]: "${alias}" takma adından kimlik çıkmadı, atlandı.`); return; }
    if (alias.length > 40 || id.length > 40) { console.error(`students.json[${i}]: "${alias}" 40 karakterden uzun, atlandı.`); return; }
    if (byId.has(id)) {
      console.error(`students.json[${i}]: "${alias}" ile "${byId.get(id).alias}" aynı kimliği (${id}) veriyor, "${alias}" atlandı.`);
      return;
    }
    const st = { id, alias, admin: !!s && s.admin === true };
    list.push(st);
    byId.set(id, st);
  });
  return { list, byId };
}
async function loadRoster() {
  try {
    const res = await fetch("students.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    roster = Object.assign(parseRoster(await res.json()), { error: null });
  } catch (e) {
    roster = { list: [], byId: new Map(), error: e.message };
    console.warn("Sınıf listesi (students.json) yüklenemedi: " + e.message);
  }
  if (me && me.alias === me.id && roster.byId.has(me.id)) me.alias = roster.byId.get(me.id).alias;
  return roster;
}
function aliasOf(id) {
  if (me && me.id === id) return me.alias;
  const r = roster.byId.get(id);
  return r ? r.alias : id || "?";
}

/* ---------- misafir modu ---------- */

const GUEST_KEY = "capi-misafir-v1";
function guestChosen() { try { return localStorage.getItem(GUEST_KEY) === "1"; } catch (e) { return false; } }
function rememberGuest() { try { localStorage.setItem(GUEST_KEY, "1"); } catch (e) {} }
function forgetGuest() { try { localStorage.removeItem(GUEST_KEY); } catch (e) {} }

/* ---------- kaydedilmeyi bekleyenler ---------- */

// süre ve doğru sayısı önce burada birikir, sonra topluca Firestore'a yazılır.
// öğrenci kimliğine göre tutulur; içinde yalnızca sayılar vardır, PIN ya da başka gizli bilgi asla yoktur
const QUEUE_KEY = "capi-bekleyen-v1";
let memQueue = {};
function readQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY);
    const q = raw ? JSON.parse(raw) : {};
    return q && typeof q === "object" ? q : {};
  } catch (e) { return memQueue; }
}
function writeQueue(q) {
  memQueue = q;
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) { /* depolama kapalı: bellekte kalır */ }
}
function cleanCount(n) {
  n = Math.floor(Number(n));
  return Number.isFinite(n) && n > 0 ? Math.min(n, 1e7) : 0;
}
function queueGet(id) {
  const e = readQueue()[id] || {};
  return { sec: cleanCount(e.sec), correct: cleanCount(e.correct) };
}
function queueSet(id, sec, correct) {
  const q = readQueue();
  if (sec > 0 || correct > 0) q[id] = { sec, correct };
  else delete q[id];
  writeQueue(q);
}
function queueAdd(id, sec, correct) {
  const p = queueGet(id);
  queueSet(id, p.sec + cleanCount(sec), p.correct + cleanCount(correct));
}
function queueTake(id, sec, correct) {
  const p = queueGet(id);
  queueSet(id, Math.max(0, p.sec - sec), Math.max(0, p.correct - correct));
}
// soru ekranından çağrılır: yalnızca doğru cevaplar sayılır
function countCorrect() {
  try { if (me) queueAdd(me.id, 0, 1); } catch (e) { /* sayaç hiçbir zaman soruyu bozmaz */ }
}

let flushing = null;
let statsEnsuredFor = null; // bu oturumda istatistik belgesi var olduğu bilinen öğrenci
let lastSaveAt = 0;
let saveFailed = false;
// biriken süreyi ve doğruları yazar; aynı anda tek yazma olur (birden çok sekme de olsa)
function flushStats() {
  if (flushing) return flushing;
  if (!cloud || !me || me.member !== true) return Promise.resolve();
  const who = me;
  const p = queueGet(who.id);
  if (!p.sec && !p.correct && statsEnsuredFor === who.id) return Promise.resolve();
  flushing = runFlush(who).finally(() => { flushing = null; updateTimerViews(); });
  return flushing;
}
async function runFlush(who) {
  const job = async () => {
    // kurallar bir yazmada sınırlı artışa izin verir; artan kısım sonraki yazmaya kalır
    for (let i = 0; i < 4; i++) {
      const p = queueGet(who.id);
      if (statsEnsuredFor === who.id && !p.sec && !p.correct) break;
      const res = await cloud.addStats(who.id, who.alias, p.sec, p.correct, weekKey(Date.now()));
      statsEnsuredFor = who.id;
      queueTake(who.id, res.sec, res.correct);
      if (me === who) myStats = res.doc;
      if (res.sec || res.correct) lastSaveAt = Date.now();
      if (!res.sec && !res.correct) break;
      if (res.sec < p.sec && res.correct >= p.correct) break; // süre sınırına takıldı: kalanı sonra
    }
  };
  try {
    if (navigator.locks && navigator.locks.request) await navigator.locks.request("capi-istatistik", job);
    else await job();
    saveFailed = false;
  } catch (e) {
    saveFailed = true;
    console.warn("İstatistik kaydedilemedi, sonra yeniden denenecek:", errCode(e));
  }
}

// tüm tarihler Europe/Istanbul takvimine göredir; saat dilimi verisi yoksa Türkiye'nin sabit UTC+3 farkı kullanılır
let istFmt = null;
try { istFmt = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Istanbul", year: "numeric", month: "2-digit", day: "2-digit" }); } catch (e) {}
function istParts(ms) {
  if (istFmt) {
    try {
      const p = {};
      for (const x of istFmt.formatToParts(new Date(ms))) p[x.type] = x.value;
      if (p.year && p.month && p.day) return { y: +p.year, m: +p.month, d: +p.day };
    } catch (e) {}
  }
  const t = new Date(ms + 3 * 3600e3);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
}
// İstanbul takvim gününün sıra numarası; iki tarih arasındaki gün farkı için
function istDay(ms) {
  const { y, m, d } = istParts(ms);
  return Date.UTC(y, m - 1, d) / DAY_MS;
}
function istMidnight(y, m, d) { return Date.UTC(y, m - 1, d) - 3 * 3600e3; }
// ISO hafta anahtarı, ör. 2026-W45: hafta pazartesi başlar, perşembenin düştüğü yıla aittir (firestore.rules ile aynı hesap)
function weekKey(ms) {
  const { y, m, d } = istParts(ms);
  const t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const wy = t.getUTCFullYear();
  const w = Math.floor((t - Date.UTC(wy, 0, 1)) / DAY_MS / 7) + 1;
  return wy + "-W" + String(w).padStart(2, "0");
}
const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
function weekRange(ms) {
  const day = istDay(ms);
  const dow = new Date(day * DAY_MS).getUTCDay() || 7;
  const a = new Date((day - dow + 1) * DAY_MS), b = new Date((day - dow + 7) * DAY_MS);
  return a.getUTCMonth() === b.getUTCMonth()
    ? a.getUTCDate() + "–" + b.getUTCDate() + " " + MONTHS[b.getUTCMonth()]
    : a.getUTCDate() + " " + MONTHS[a.getUTCMonth()] + " – " + b.getUTCDate() + " " + MONTHS[b.getUTCMonth()];
}
function pad2(n) { return String(n).padStart(2, "0"); }
function fmtDate(ms) { const { y, m, d } = istParts(ms); return pad2(d) + "/" + pad2(m) + "/" + y; }
function isoDate(ms) { const { y, m, d } = istParts(ms); return y + "-" + pad2(m) + "-" + pad2(d); }
// "3 sa 12 dk"
function fmtDuration(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  if (h) return h + " sa" + (m ? " " + m + " dk" : "");
  if (m) return m + " dk";
  return sec ? "1 dk'dan az" : "0 dk";
}
// "1 dk 20 sn"
function fmtShort(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  if (sec >= 3600) return fmtDuration(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? m + " dk" + (s ? " " + s + " sn" : "") : s + " sn";
}
// "01:02:03"
function fmtClock(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000);
  return pad2(Math.floor(s / 3600)) + ":" + pad2(Math.floor(s % 3600 / 60)) + ":" + pad2(s % 60);
}
function fmtHour(ms) { const d = new Date(ms); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }

let signinMode = "in";
function pinInput(id, autocomplete) {
  return el("input", {
    id, class: "pin", type: "password", inputmode: "numeric", pattern: "[0-9]*", maxlength: "6", autocomplete,
    oninput: (e) => { const v = e.target.value.replace(/\D/g, "").slice(0, 6); if (v !== e.target.value) e.target.value = v; }
  });
}
function field(label, input, extra) {
  return el("div", { class: "field" }, [el("label", { for: input.id, text: label }), input].concat(extra || []));
}
// tahmin edilmesi çok kolay PIN'ler: 000000, 123456, 654321, 121212, 123123 gibi
function weakPin(p) {
  return /^(\d)\1{5}$/.test(p) || /^(\d\d)\1\1$/.test(p) || /^(\d\d\d)\1$/.test(p)
    || "01234567890".includes(p) || "09876543210".includes(p);
}
function authMessage(e, signup) {
  const c = errCode(e);
  if (["auth/invalid-credential", "auth/invalid-login-credentials", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(c)) {
    return signup ? "Bu isimle hesap açılamadı, ahmojunior ile iletişime geç."
      : "İsim ya da PIN yanlış. İlk kez giriyorsan “İlk kez giriyorum” sekmesini seç.";
  }
  if (c === "auth/email-already-in-use") return "Bu isim zaten alınmış. Giriş yap ya da ahmojunior ile iletişime geç.";
  if (c === "auth/too-many-requests") return "Çok fazla deneme, biraz bekle.";
  if (c === "auth/network-request-failed" || c === "timeout" || c.startsWith("auth/api-key")) return NET_ERR;
  if (c === "auth/weak-password" || c === "auth/password-does-not-meet-requirements") return "Bu PIN kabul edilmedi, başka bir 6 haneli PIN dene.";
  if (c === "auth/user-disabled") return "Bu hesap kapatılmış, ahmojunior ile iletişime geç.";
  if (c === "auth/operation-not-allowed") return "Giriş şu an kapalı, ahmojunior ile iletişime geç.";
  console.warn("Giriş hatası:", c);
  return "Bir şeyler ters gitti (" + c + "). ahmojunior ile iletişime geç.";
}

  async function onSubmit(ev) {

    }
  }

async function doSignOut() {

  try { await withTimeout(flushStats(), 6000); } catch (e) { /* kalanı bekleyenlerde durur, sonraki girişte yazılır */ }

/* ---------- zamanlayıcı ---------- */

// süre performance.now() farklarıyla ölçülür; setInterval yalnızca ekranı tazeler ve kaydı tetikler.
// sayaç yalnızca Başlat'a basılmışken ve sayfa görünürken sayar
const timer = { running: false, accMs: 0, segStart: null, lastTick: 0, carryMs: 0, autoPaused: false, tick: null };
function timerElapsedMs() {
  return timer.accMs + (timer.segStart != null ? Math.max(0, performance.now() - timer.segStart) : 0);
}
// şu ana kadarki parçayı toplama ekler; giriş yapılmışsa tam saniyeleri bekleyenlere yazar
function timerCommit() {
  if (timer.segStart == null) return;
  const now = performance.now();
  // tik 10 sn'den uzun gelmediyse cihaz uyumuş demektir: aradaki süre sayılmaz
  const end = timer.lastTick && now - timer.lastTick > 10000 ? timer.lastTick + 1000 : now;
  const d = Math.max(0, end - timer.segStart);
  timer.accMs += d;
  timer.segStart = timer.running && document.visibilityState === "visible" ? now : null;
  timer.lastTick = now;
  if (me) {
    timer.carryMs += d;
    const s = Math.floor(timer.carryMs / 1000);
    if (s > 0) { timer.carryMs -= s * 1000; queueAdd(me.id, s, 0); }
  }
}
function timerTick() {
  const now = performance.now();
  if (timer.segStart != null && timer.lastTick && now - timer.lastTick > 10000) timerCommit();
  timer.lastTick = now;
  updateTimerViews();
}
function syncTick() {
  if (timer.running && !timer.tick) timer.tick = setInterval(timerTick, 1000);
  if (!timer.running && timer.tick) { clearInterval(timer.tick); timer.tick = null; }
}
function timerStart() {
  if (timer.running) return;
  timer.running = true;
  timer.autoPaused = false;
  if (document.visibilityState === "visible") { timer.segStart = performance.now(); timer.lastTick = timer.segStart; }
  syncTick();
  updateTimerViews();
  refreshChrome();
}
function timerPause() {
  if (!timer.running) return;
  timerCommit();
  timer.running = false;
  timer.segStart = null;
  timer.autoPaused = false;
  syncTick();
  flushStats();
  updateTimerViews();
  refreshChrome();
}
function timerReset() {
  if (timer.running) timerPause();
  timer.accMs = 0;
  timer.carryMs = 0;
  updateTimerViews();
  refreshChrome();
}
function resumeIfVisible() {
  if (timer.running && timer.segStart == null && document.visibilityState === "visible") {
    timer.segStart = performance.now();
    timer.lastTick = timer.segStart;
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (timer.segStart != null) { timerCommit(); timer.autoPaused = true; }
    flushStats();
  } else {
    resumeIfVisible();
  }
  updateTimerViews();
});
window.addEventListener("pageshow", () => { resumeIfVisible(); updateTimerViews(); });
window.addEventListener("pagehide", () => { timerCommit(); flushStats(); });
setInterval(() => {
  timerCommit();
  if (me && me.member === null) checkMembership();
  flushStats();
}, SAVE_EVERY_MS);

let boardMetric = "correct";

function segGroup(label, options, current, onPick) {

function renderBoard() {
  const page = sharedPage("board");

  const cap = el("span", { class: "cap" });

  const list = el("div", {}, []);
  page.append(controls, el("div", { class: "lbhead" }, [cap, refreshBtn]), list);
  let rows = null;

  function value(r, wk) {
    if (boardPeriod === "week" && r.weekKey !== wk) return 0;
    if (boardMetric === "correct") return boardPeriod === "week" ? r.weekCorrect : r.totalCorrect;
    return boardPeriod === "week" ? r.weekSeconds : r.totalSeconds;
  }
  function draw() {
    controls.replaceChildren(
      segGroup("Ölçüt", [["correct", "Doğru soru"], ["time", "Çalışma süresi"]], boardMetric, v => { boardMetric = v; draw(); }),
      segGroup("Dönem", [["week", "Haftalık"], ["all", "Tüm zamanlar"]], boardPeriod, v => { boardPeriod = v; draw(); })
    );
    const now = Date.now();
    cap.textContent = boardPeriod === "week" ? "Bu hafta · " + weekRange(now) + " (pazartesi sıfırlanır)" : "Tüm zamanlar";
    if (!rows) return;
    const wk = weekKey(now);
    const data = rows.slice();
    if (me && !data.some(r => r.id === me.id)) {
      data.push({ id: me.id, alias: me.alias, totalCorrect: 0, totalSeconds: 0, weekKey: "", weekCorrect: 0, weekSeconds: 0 });
    }
    data.sort((a, b) => value(b, wk) - value(a, wk) || a.alias.localeCompare(b.alias, "tr"));
    const kids = [];
    if (data.every(r => value(r, wk) === 0)) {
      kids.push(buddy("idle", boardPeriod === "week" ? "Bu hafta henüz puan yok. İlk sen ol!" : "Henüz puan yok. İlk sen ol!").row);
    }
    // eşit değerler aynı sırayı paylaşır: 1, 2, 2, 4
    let rank = 0;
    const ol = el("ol", { class: "lb" }, []);
    data.forEach((r, i) => {
      const v = value(r, wk);
      if (i === 0 || v !== value(data[i - 1], wk)) rank = i + 1;
      const mine = me && r.id === me.id;
      const cls = [v === 0 ? "zero" : "", v > 0 && rank === 1 ? "first" : "", mine ? "me" : ""].filter(Boolean).join(" ");
      ol.appendChild(el("li", { class: cls, "aria-current": mine ? "true" : false }, [
        el("span", { class: "rk", text: v === 0 ? "–" : String(rank) }),
        el("span", { class: "nm", text: r.alias + (mine ? " (sen)" : "") }),
        el("span", { class: "val", text: boardMetric === "correct" ? v + " doğru" : fmtDuration(v) })
      ]));
    });
    kids.push(ol);
    list.replaceChildren(...kids);
  }
  async function load() {
    refreshBtn.disabled = true;
    list.replaceChildren(loadingLine("Sıralama yükleniyor…"));
    try {
      // kendi bekleyen süren ve doğruların önce yazılsın ki listede güncel görün
      timerCommit();

      rows = await withTimeout(cloud.listStats(), 15000);

      console.warn("Sıralama yüklenemedi:", errCode(e));
      list.replaceChildren(errbox(errMessage(e)));
    }
    refreshBtn.disabled = false;

  draw();
  load();
}

    const now = Date.now();
    const today = istDay(now);
    // son tarihinden 7 gün sonrasına kadar görünür; veritabanından silinmez
    const active = tasks
      .filter(t => !t.deletedAtMs && istDay(t.dueMs) - today >= -TASK_KEEP_DAYS)
      .filter(t => taskFilter === "all" || t.type === taskFilter)
      .sort((a, b) => a.dueMs - b.dueMs || (a.createdAtMs || 0) - (b.createdAtMs || 0));
    // silinenler 7 gün boyunca geri alınabilir, sonra gizlenir
    const trash = tasks
      .filter(t => t.deletedAtMs && now - t.deletedAtMs < TASK_KEEP_DAYS * DAY_MS)
      .sort((a, b) => b.deletedAtMs - a.deletedAtMs);
    const kids = [];
    if (!active.length) {
      kids.push(buddy("happy", taskFilter === "event" ? "Yaklaşan etkinlik yok."
        : taskFilter === "homework" ? "Yaklaşan ödev yok. Keyfine bak!" : "Yaklaşan ödev ya da etkinlik yok. Keyfine bak!").row);
    }

      ].concat(trash.map(t => taskCard(t, true, load)))));

// "Matematik Ders Kitabı – 55 ile 60. sayfaları tamamla – Son: 11/11/2026 – 4 gün kaldı"
function taskCard(t, inTrash, reload) {
  const left = istDay(t.dueMs) - istDay(Date.now());
  const ev = t.type === "event";
  const rel = left === 0 ? "Bugün" : left === 1 ? "Yarın" : left > 1 ? left + " gün kaldı"
    : ev ? -left + " gün geçti" : -left + " gün gecikti";
  const line = el("p", { class: "line" }, [
    el("b", { text: (t.subject + " " + t.title).trim() }),
    t.description ? " – " + t.description : "",
    " – " + (ev ? "Tarih: " : "Son: ") + fmtDate(t.dueMs) + " – ",
    el("span", { class: "rel" + (left < 0 ? " late" : left <= 1 ? " soon" : ""), text: rel })
  ]);
  const meta = ["Ekleyen: " + (t.createdByAlias || aliasOf(t.createdBy))];
  if (t.editedBy) meta.push("Düzenleyen: " + (t.editedByAlias || aliasOf(t.editedBy)));
  if (inTrash) meta.push("Silen: " + aliasOf(t.deletedBy));
  const errp = el("p", { class: "formerr", role: "alert" });
  const acts = el("div", { class: "acts" }, []);
  const card = el("article", { class: "task" + (left < 0 ? " past" : "") }, [
    el("span", { class: "kind" + (ev ? " event" : ""), text: ev ? "Etkinlik" : "Ödev" }),
    line,
    el("div", { class: "meta", text: meta.join(" · ") }),
    acts
  ]);
  async function act(work) {
    errp.textContent = "";
    acts.querySelectorAll("button").forEach(b => { b.disabled = true; });
    try {
      await withTimeout(work(), 15000);
      reload();
    } catch (e) {
      console.warn("Ödev güncellenemedi:", errCode(e));
      errp.textContent = errMessage(e);
      acts.querySelectorAll("button").forEach(b => { b.disabled = false; });
      card.appendChild(errp);
    }
  }
  if (me && !inTrash) {
    acts.appendChild(el("button", { class: "minibtn", onclick: () => renderTaskForm(t) }, ["Düzenle"]));
    const del = el("button", { class: "minibtn warn", onclick: () => {

    } }, ["Sil"]);
    acts.appendChild(del);
  } else if (me && inTrash) {
    acts.appendChild(el("button", { class: "minibtn", onclick: () => act(() => cloud.restoreTask(t.id, me)) }, ["Geri al"]));
  }

}

      }
      const key = o && mode !== "normal" ? text(o.weekKey) : weekKey;
      const sameWeek = !!o && o.weekKey === key;
      const n = {
        alias,
        totalCorrect: (o ? count(o.totalCorrect) : 0) + correct,
        totalSeconds: (o ? count(o.totalSeconds) : 0) + sec,
        weekKey: key,
        weekCorrect: (sameWeek ? count(o.weekCorrect) : 0) + correct,
        weekSeconds: (sameWeek ? count(o.weekSeconds) : 0) + sec,
        updatedAt: serverTimestamp()
      };
      tx.set(ref, n);
      return { sec, correct, doc: plainStats(id, n), wrote: true };
    });
    const run = async (mode) => {
      const res = await attempt(mode);
      if (res.wrote) lastWrite = { id, at: performance.now(), u: null };
      else if (res.local && lastWrite) lastWrite.u = res.u;
      return res;
    };
    try {
      return await run("normal");
    } catch (e) {
      if (e.code !== "permission-denied") throw e;
      try {
        return await run("keepWeek");
      } catch (e2) {
        if (e2.code !== "permission-denied") throw e2;
        return await run("baseline");
      }
    }
  }

  const api = {
    onAuth(cb) {
      return fbAuth.onAuthStateChanged(auth, (u) => cb(u ? { email: u.email || "" } : null));
    },
    async signIn(id, pin) {
      const c = await fbAuth.signInWithEmailAndPassword(auth, emailOf(id), pin);
      return { email: c.user.email || "" };
    },
    async signUp(id, pin) {
      const c = await fbAuth.createUserWithEmailAndPassword(auth, emailOf(id), pin);
      return { email: c.user.email || "" };
    },
    signOut() { return fbAuth.signOut(auth); },

    async getStudent(id) {
      const s = await getDocFromServer(doc(db, "students", id));
      return s.exists() ? { id, alias: text(s.data().alias), admin: s.data().admin === true } : null;
    },
    async listStudents() {
      const qs = await getDocsFromServer(collection(db, "students"));
      return qs.docs.map((d) => ({ id: d.id, alias: text(d.data().alias), admin: d.data().admin === true }));
    },
    async syncStudents(list) {
      const batch = writeBatch(db);
      list.forEach((s) => batch.set(doc(db, "students", s.id), { alias: s.alias, admin: s.admin === true }));
      await batch.commit();
      return list.length;
    },

    async listStats() {
      const qs = await getDocsFromServer(collection(db, "stats"));
      return qs.docs.map((d) => plainStats(d.id, d.data()));
    },
    addStats,

    async listTasks() {
      const qs = await getDocsFromServer(collection(db, "tasks"));
      return qs.docs.map((d) => {
        const x = d.data();
        return {
          id: d.id, type: x.type === "event" ? "event" : "homework",
          subject: text(x.subject), title: text(x.title), description: text(x.description),
          dueMs: millis(x.dueDate) || 0,
          createdBy: text(x.createdBy), createdByAlias: text(x.createdByAlias), createdAtMs: millis(x.createdAt),
          editedBy: text(x.editedBy), editedByAlias: text(x.editedByAlias), editedAtMs: millis(x.editedAt),
          deletedAtMs: millis(x.deletedAt), deletedBy: text(x.deletedBy)
        };
      });
    },
    addTask(t, by) {
      return addDoc(collection(db, "tasks"), {
        ...taskFields(t), createdBy: by.id, createdByAlias: by.alias, createdAt: serverTimestamp()
      });
    },
    updateTask(id, t, by) {
      return updateDoc(doc(db, "tasks", id), { ...taskFields(t), ...edited(by) });
    },
    softDeleteTask(id, by) {
      return updateDoc(doc(db, "tasks", id), { deletedAt: serverTimestamp(), deletedBy: by.id, ...edited(by) });
    },
    restoreTask(id, by) {
      return updateDoc(doc(db, "tasks", id), { deletedAt: deleteField(), deletedBy: deleteField(), ...edited(by) });
    }
  };
  report(true, api);
} catch (e) {
  console.warn("Firebase yüklenemedi, misafir modunda devam ediliyor:", e && e.message ? e.message : e);
  report(false, e);
}
</script>
