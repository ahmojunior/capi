/* ---------- konu anlatımı ---------- */

// Ders, dil uygulamalarındaki gibi küçük parçalar hâlinde ilerler:
// her adımın içeriği "vuruş"lara (beat) bölünür ve Devam'a her basışta bir sonraki parça açılır.
// İki sütunlu tablolar çevrilebilir kartlara, çok sütunlu tablolar dokununca açılan hücrelere dönüşür;
// araya hızlı kontrol soruları girer ve ders sonunda kısa bir son kontrol ile kutlama ekranı gelir.
const LESSON_XP = 10;

function lessonKey(key, unit) { return key + "/" + unit; }
function lessonDone(key, unit) { return !!(store.les && store.les[lessonKey(key, unit)]); }

// adım içeriğini sırayla gösterilecek parçalara böler
function lessonBeats(key, st, si) {
  const beats = [];
  if (st.poem) beats.push({ k: "poem", t: st.poem });
  (st.text || []).forEach(t => beats.push({ k: "text", t }));
  if (st.f && st.f.length) beats.push({ k: "f", f: st.f });
  if (st.list && st.list.length) {
    for (let i = 0; i < st.list.length; i += 3) beats.push({ k: "list", items: st.list.slice(i, i + 3), start: i });
  }
  if (st.fig) beats.push({ k: "fig" });
  if (st.table) {
    const t = st.table;
    if (t.h.length === 2) {
      beats.push({ k: "cards" });
      const auto = tableCheck(t, si);
      if (auto) beats.push({ k: "check", c: auto, auto: true });
    } else {
      beats.push({ k: "table" });
    }
  }
  if (st.tip) beats.push({ k: "tip" });
  [].concat(st.check || []).forEach(c => beats.push({ k: "check", c }));
  return beats;
}

// iki sütunlu tablodan kendiliğinden bir hızlı kontrol sorusu üretir
function tableCheck(t, seed) {
  if (t.r.length < 4) return null;
  const rows = t.r.filter(r => r[0] && r[1]);
  const row = rows[(seed * 7 + 3) % rows.length];
  const others = [...new Set(rows.map(r => r[1]).filter(v => v !== row[1]))];
  if (others.length < 2) return null;
  const choices = [row[1]].concat(shuffle(others).slice(0, 2));
  const tr = /türkçe/i.test(t.h[1]);
  return {
    q: tr ? "“" + row[0] + "” ne demek?" : "“" + row[0] + "” → " + (t.h[1] || "karşılığı") + "?",
    choices, answer: 0,
    why: row[0] + " = " + row[1]
  };
}

function validCheck(c) {
  if (!c || typeof c !== "object" || !c.q) return false;
  if (typeof c.answer === "boolean") return true;
  return Array.isArray(c.choices) && c.choices.length >= 2 && Number.isInteger(c.answer) && c.answer >= 0 && c.answer < c.choices.length;
}

// ders sonundaki son kontrol: konunun soru bankasından iki kısa soru
function finalChecks(key, unit) {
  const pool = (banks[key] || []).filter(q => q.unit === unit && (q.type === "mc" || q.type === "fill" || q.type === "tf"));
  return shuffle(pool).slice(0, 2).map(q => ({
    q: q.q, src: q.src, table: q.table, fig: q.fig,
    choices: q.type === "tf" ? null : q.choices, answer: q.answer, why: q.why
  }));
}

function renderLesson(key, unit, i) {
  closeGloss();
  const steps = lessons[key][unit];
  state = null;
  // ders boyunca kontrol sonuçları burada birikir; ilk adıma dönülse de sıfırlanmaz
  if (!lessonRun || lessonRun.key !== key || lessonRun.unit !== unit || lessonRun.finished) {
    lessonRun = { key, unit, ok: 0, total: 0, xp: 0, seen: {}, finished: false };
  }
  lessonRun.i = i;
  if (i >= steps.length) return renderLessonFinal(key, unit);
  const st = steps[i];
  const revisit = !!lessonRun.seen[i];
  lessonRun.seen[i] = true;
  const beats = lessonBeats(key, st, i);
  let shown = 0;
  const lang = subjectLang(key);

  setSubject(key);
  app.innerHTML = "";
  window.scrollTo(0, 0);

  const total = steps.length + 1;
  const bar = el("i", {});
  app.appendChild(topbar(() => renderSubject(key), (i + 1) + "/" + total));
  app.appendChild(el("div", { class: "track" }, [bar]));
  app.appendChild(el("div", { class: "unitname", text: "Konu anlatımı · " + unit }));
  const mate = buddy(st.mood || (i === 0 ? "happy" : "idle"), st.say);
  app.appendChild(mate.row);

  const card = el("div", { class: "lcard" }, [el("h2", { text: st.title })]);
  app.appendChild(card);

  let waiting = false; // açık bir kontrol sorusu cevaplanmadan Devam kapalı
  let next = null;
  function progress() {
    const part = beats.length ? shown / beats.length : 1;
    bar.style.width = (100 * (i + part) / total) + "%";
  }

  function addBeat(b, animate) {
    const node = beatNode(b);
    if (animate) node.classList.add("beatin");
    card.appendChild(node);
    shown++;
    progress();
    if (animate && node.scrollIntoView) {
      setTimeout(() => node.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }), 30);
    }
  }

  function beatNode(b) {
    if (b.k === "text") return el("p", { text: b.t });
    if (b.k === "poem") return el("p", { class: "poem", text: b.t });
    if (b.k === "f") return el("div", { class: "formula" }, b.f.flatMap((t, k) => k ? [el("br"), t] : [t]));
    if (b.k === "list") return el("ul", { class: "beatlist" }, b.items.map(t => el("li", { text: t })));
    if (b.k === "fig") return el("div", {}, [renderFig(st.fig)]);
    if (b.k === "tip") return el("p", { class: "tip" }, [el("b", { text: "Dikkat: " }), st.tip]);
    if (b.k === "cards") return flipCards(st.table, lang, mate);
    if (b.k === "table") return revealTable(st.table, mate);
    if (b.k === "check") {
      if (!revisit) { waiting = true; refreshNext(); }
      return lessonCheck(b.c, mate, revisit, () => { waiting = false; refreshNext(); });
    }
    return el("div", {});
  }

  // ilk parça hemen; daha önce görülen adımda hepsi açık gelir
  if (beats.length) {
    if (revisit) beats.forEach(b => addBeat(b, false));
    else addBeat(beats[0], false);
  }
  progress();

  foot.hidden = false;
  foot.className = "";
  footinner.innerHTML = "";
  const back = el("button", { class: "btn side", onclick: () => i ? renderLesson(key, unit, i - 1) : renderSubject(key) },
    [i ? "Önceki" : "Konular"]);
  next = el("button", { class: "btn solid main", onclick: () => {
    if (waiting) return;
    if (shown < beats.length) addBeat(beats[shown], true);
    else renderLesson(key, unit, i + 1);
    refreshNext();
  } }, ["Devam"]);
  function refreshNext() {
    if (!next) return;
    next.disabled = waiting;
    next.style.opacity = waiting ? ".45" : "1";
    next.textContent = waiting ? "Önce cevapla" : "Devam";
  }
  footinner.appendChild(el("div", { class: "btnrow" }, [back, next]));
  refreshNext();
}
let lessonRun = null;

// iki sütunlu tablo → çevrilebilir kelime kartları
function flipCards(t, lang, mate) {
  const wrap = el("div", { class: "fcwrap" }, []);
  const info = el("div", { class: "fcinfo" }, []);
  const grid = el("div", { class: "fcgrid" }, []);
  let flipped = 0;
  const label = () => {
    info.textContent = flipped === t.r.length
      ? "Hepsini çevirdin! ✓"
      : "Kartlara dokun ve çevir · " + flipped + "/" + t.r.length;
    info.classList.toggle("done", flipped === t.r.length);
  };
  t.r.forEach(r => {
    const front = el("div", { class: "fcface front" }, [el("span", { class: "fctext", text: r[0] })]);
    const sp = lang ? speakButton(r[0], lang) : null;
    if (sp) front.appendChild(sp);
    const backFace = el("div", { class: "fcface back" }, [el("span", { class: "fctext", text: r[1] })]);
    const c = el("div", { class: "fc", role: "button", tabindex: "0", "aria-label": r[0] + " kartını çevir" }, [
      el("div", { class: "fcinner" }, [front, backFace])
    ]);
    let seen = false;
    const flip = () => {
      c.classList.toggle("on");
      c.setAttribute("aria-label", c.classList.contains("on") ? r[0] + ": " + r[1] : r[0] + " kartını çevir");
      if (!seen) {
        seen = true; flipped++; label();
        if (flipped === t.r.length) mate.say("happy", "Hepsini çevirdin, süper!");
      }
    };
    c.addEventListener("click", flip);
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    grid.appendChild(c);
  });
  // başlık satırı ipucu: hangi taraf ön yüz?
  if (t.h[0] || t.h[1]) wrap.appendChild(el("div", { class: "fchead", text: (t.h[0] || "") + " → " + (t.h[1] || "") }));
  wrap.appendChild(grid);
  wrap.appendChild(info);
  label();
  return wrap;
}

// çok sütunlu tablo: ilk sütun açık, diğer hücreler dokununca açılır (önce tahmin et, sonra bak)
function revealTable(t, mate) {
  const named = t.h.slice(1).some(h => h);
  if (!named || t.r.length > 8) return renderTable(t);
  let hidden = 0;
  const cells = [];
  const head = el("tr", {}, t.h.map(c => el("th", { text: c })));
  const rows = t.r.map(r => el("tr", {}, r.map((c, ci) => {
    if (ci === 0 || !c) return el("td", { text: c });
    hidden++;
    const td = el("td", { class: "hid", tabindex: "0", role: "button", "aria-label": "Gizli hücre, açmak için dokun" }, [el("span", { text: c })]);
    const open = () => {
      if (!td.classList.contains("hid")) return;
      td.classList.remove("hid"); td.classList.add("shown");
      td.removeAttribute("role"); td.removeAttribute("tabindex"); td.removeAttribute("aria-label");
      if (--hidden === 0) { allBtn.remove(); mate.say("happy", "Tablonun tamamı açıldı!"); }
    };
    td.addEventListener("click", open);
    td.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    cells.push(open);
    return td;
  })));
  const allBtn = el("button", { class: "revealall", onclick: () => cells.forEach(f => f()) }, ["Hepsini göster"]);
  return el("div", { class: "revealwrap" }, [
    el("div", { class: "fcinfo", text: "Önce tahmin et, sonra hücreye dokunup kontrol et." }),
    el("div", { class: "tablewrap" }, [el("table", { class: "dtable reveal" }, [el("thead", {}, [head]), el("tbody", {}, rows)])]),
    allBtn
  ]);
}

// ders içi hızlı kontrol: hemen geri bildirim, doğruya XP
function lessonCheck(c, mate, practiceOnly, onDone) {
  const box = el("div", { class: "lcheck" }, [el("div", { class: "lchead" }, ["⚡ Hızlı kontrol"])]);
  box.appendChild(el("div", { class: "lcq", text: c.q }));
  if (c.src) box.appendChild(el("div", { class: "lcsrc", text: c.src }));
  if (c.fig || c.table) appendMedia(box, c);
  const opts = c.choices
    ? shuffle(c.choices.map((t, idx) => ({ t, v: idx })))
    : [{ t: "Doğru", v: true }, { t: "Yanlış", v: false }];
  const btns = [];
  let answered = false;
  opts.forEach((o, pos) => {
    const b = el("button", { class: "choice", onclick: () => pick(o, b) }, [
      el("span", { class: "key", text: c.choices ? KEYS[pos] : (o.v ? "D" : "Y") }),
      el("span", { class: "label", text: o.t })
    ]);
    b.dataset.v = String(o.v);
    btns.push(b);
    box.appendChild(b);
  });
  const fb = el("div", { class: "lcfb" }, []);
  box.appendChild(fb);
  function pick(o, b) {
    if (answered) return;
    answered = true;
    const ok = o.v === c.answer;
    btns.forEach(x => {
      x.disabled = true;
      if (x.dataset.v === String(c.answer)) x.classList.add("ok");
    });
    if (!ok) b.classList.add("bad");
    if (!practiceOnly && lessonRun) {
      lessonRun.total++;
      if (ok) { lessonRun.ok++; lessonRun.xp += LESSON_XP; }
    }
    box.classList.add(ok ? "good" : "miss");
    fb.innerHTML = "";
    fb.appendChild(el("div", { class: "lcverdict" }, [ok ? "Doğru!" : "Olmadı."].concat(ok && !practiceOnly ? [el("span", { class: "xp", text: "+" + LESSON_XP + " XP" })] : [])));
    if (c.why) fb.appendChild(el("div", { class: "why", text: c.why }));
    mate.say(ok ? "happy" : "sad", mikeyLine(ok ? "happy" : "sad"));
    onDone();
  }
  return box;
}

// son adım: konunun bankasından iki soru, ardından kutlama
function renderLessonFinal(key, unit) {
  const steps = lessons[key][unit];
  const total = steps.length + 1;
  const checks = lessonRun.finalChecks || (lessonRun.finalChecks = finalChecks(key, unit));
  if (!checks.length) return renderLessonDone(key, unit);
  setSubject(key);
  app.innerHTML = "";
  window.scrollTo(0, 0);
  app.appendChild(topbar(() => renderSubject(key), total + "/" + total));
  const bar = el("i", { style: "width:" + (100 * (total - 1) / total) + "%" });
  app.appendChild(el("div", { class: "track" }, [bar]));
  app.appendChild(el("div", { class: "unitname", text: "Konu anlatımı · " + unit }));
  const mate = buddy("idle", "Son kontrol! Bakalım ne kadar aklında kaldı.");
  app.appendChild(mate.row);
  const card = el("div", { class: "lcard" }, [el("h2", { text: "Son kontrol" })]);
  app.appendChild(card);
  const revisit = !!lessonRun.finalSeen;
  lessonRun.finalSeen = true;
  let left = revisit ? 0 : checks.length;
  checks.forEach(c => card.appendChild(lessonCheck(c, mate, revisit, () => {
    left--;
    bar.style.width = (100 * (total - left / checks.length) / total) + "%";
    refresh();
  })));

  foot.hidden = false;
  foot.className = "";
  footinner.innerHTML = "";
  const back = el("button", { class: "btn side", onclick: () => renderLesson(key, unit, steps.length - 1) }, ["Önceki"]);
  const next = el("button", { class: "btn solid main", onclick: () => { if (left <= 0) renderLessonDone(key, unit); } }, ["Bitir"]);
  function refresh() {
    next.disabled = left > 0;
    next.style.opacity = left > 0 ? ".45" : "1";
    next.textContent = left > 0 ? "Önce cevapla" : "Dersi bitir";
  }
  footinner.appendChild(el("div", { class: "btnrow" }, [back, next]));
  refresh();
}

function renderLessonDone(key, unit) {
  const run = lessonRun || { ok: 0, total: 0, xp: 0 };
  run.finished = true;
  store.les = store.les || {};
  const k = lessonKey(key, unit);
  const prev = store.les[k] || { n: 0, best: 0 };
  store.les[k] = { n: prev.n + 1, best: Math.max(prev.best, run.xp) };
  touchDay();
  saveStore();

  setSubject(key);
  app.innerHTML = "";
  window.scrollTo(0, 0);
  app.appendChild(topbar(() => renderSubject(key), ""));
  app.appendChild(el("div", { class: "track" }, [el("i", { style: "width:100%" })]));
  const perfect = run.total > 0 && run.ok === run.total;
  app.appendChild(buddy("happy", perfect ? "Kusursuz! Hepsini bildin!" : "Dersi bitirdin, harikasın!", "resultbuddy").row);
  app.appendChild(el("h1", { class: "lessontitle donetitle" }, [highlight("Ders tamamlandı!")]));
  app.appendChild(el("p", { class: "hero-note", text: unit }));
  const stats = el("div", { class: "lstats" }, [
    el("div", { class: "lstat" }, [el("b", { text: "+" + run.xp }), el("span", { text: "XP" })]),
    el("div", { class: "lstat" }, [el("b", { text: run.ok + "/" + run.total }), el("span", { text: "kontrol doğru" })]),
    el("div", { class: "lstat" }, [el("b", { text: run.total ? Math.round(100 * run.ok / run.total) + "%" : "–" }), el("span", { text: "isabet" })])
  ]);
  app.appendChild(stats);
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    stats.querySelectorAll(".lstat").forEach((s, n) => s.animate(
      [{ transform: "translateY(12px) scale(.9)", opacity: 0 }, { transform: "none", opacity: 1 }],
      { duration: 380, delay: 150 + n * 120, easing: "cubic-bezier(.2,1.5,.4,1)", fill: "backwards" }));
  }

  foot.hidden = false;
  foot.className = "";
  footinner.innerHTML = "";
  footinner.appendChild(el("div", { class: "btnrow" }, [
    el("button", { class: "btn side", onclick: () => { lessonRun = null; renderSubject(key); } }, ["Konular"]),
    el("button", { class: "btn solid main", onclick: () => { lessonRun = null; startRound(key, unit); } }, ["Bu konudan soru çöz"])
  ]));
}

/* ---------- tur seçimi ---------- */

function pickQuestions(key, unit) {
  let pool = banks[key].filter(q => !unit || q.unit === unit);
  if (!pool.length) return [];
  // ağırlık: yanlış ya da hiç doğru yapılmadan boş bırakılanlar 3x, hiç görülmemiş 2x, bilinenler 1x
  const weighted = [];
  for (const q of pool) {
    const s = stat(q.id);
    let w = 1;
    if (s.w > s.c || (s.s && !s.c)) w = 3;
    else if (s.c + s.w + (s.s || 0) === 0) w = 2;
    for (let i = 0; i < w; i++) weighted.push(q);
  }
  const picked = [];
  const seen = new Set();
  for (const q of shuffle(weighted)) {
    if (seen.has(q.id)) continue;
    seen.add(q.id);
    picked.push(q);
    if (picked.length === ROUND_SIZE) break;
  }
  return picked;
}

function startRound(key, unit, fixedList) {
  const list = fixedList && fixedList.length ? shuffle(fixedList) : pickQuestions(key, unit);
  if (!list.length) { renderSubject(key); return; }
  touchDay();
  state = { key, unit, list, i: 0, correct: 0, wrong: [], skipped: [], answered: false, sel: null, streak: 0, buddy: null };
  renderQuestion();
}

/* ---------- soru ekranı ---------- */

function renderQuestion() {
  closeGloss();
  const q = state.list[state.i];
  setSubject(state.key);

  state.answered = false;
  state.sel = null;
  app.innerHTML = "";

  app.appendChild(topbar(
    () => { if (confirm("Turu bırakıyor musun?")) renderSubject(state.key); },
    (state.i + 1) + "/" + state.list.length
  ));
  app.appendChild(el("div", { class: "track" }, [el("i", { style: "width:" + (100 * state.i / state.list.length) + "%" })]));
  const opener = state.i === 0 ? "Hadi başlayalım!"
    : state.i === state.list.length - 1 ? "Son soru, bitirelim!"
    : mikeyLine("start");
  state.buddy = buddy("idle", opener);
  app.appendChild(state.buddy.row);
  const subj = SUBJECTS.find(s => s.key === state.key);
  app.appendChild(el("div", { class: "unitname" }, q.gold ? [q.unit, el("span", { class: "goldtag", text: subj.goldTag || "★ Altın soru" })] : [q.unit]));
  const hints = hintFilter(state.key, q);
  app.appendChild(el("h1", { class: "qtext" }, glossText(q.q, state.key, hints)));
  // src: çevrilecek ya da okunacak cümle; tts varsa yanında dinleme düğmesi çıkar
  if (q.src) {
    const card = el("div", { class: "srccard" }, []);
    const sp = q.tts ? speakButton(q.tts, subjectLang(state.key)) : null;
    if (sp) card.appendChild(sp);
    card.appendChild(el("div", { class: "txt" }, glossText(q.src, state.key, hints)));
    app.appendChild(card);
  }
  appendMedia(app, q);

  const body = el("div", {}, []);
  app.appendChild(body);

  if (q.type === "mc" || q.type === "fill") renderChoices(body, q);
  else if (q.type === "tf") renderTF(body, q);
  else if (q.type === "match") renderMatch(body, q);
  else if (q.type === "tiles") renderTiles(body, q);
  else if (q.type === "order") renderOrder(body, q);
  else if (q.type === "build") renderBuild(body, q);
  else if (q.type === "listen") renderListen(body, q);
  else if (q.type === "write") renderWrite(body, q);

  setFooterCheck();
}

function setFooterCheck() {
  foot.hidden = false;
  foot.className = "";
  footinner.innerHTML = "";
  const btn = el("button", { class: "btn solid main", id: "checkbtn", onclick: submit }, ["Kontrol et"]);
  btn.disabled = !hasAnswer();
  btn.style.opacity = btn.disabled ? ".45" : "1";
  const skip = el("button", { class: "btn side", onclick: skipQuestion }, ["Boş bırak"]);
  footinner.appendChild(el("div", { class: "btnrow" }, [skip, btn]));
}
function refreshCheck() {
  const btn = document.getElementById("checkbtn");
  if (!btn) return;
  btn.disabled = !hasAnswer();
  btn.style.opacity = btn.disabled ? ".45" : "1";
  // cevap ilk kez tamamlandığında Mikey düşünmeye başlar
  if (!btn.disabled && state.buddy && state.buddy.mood() === "idle") state.buddy.say("think", mikeyLine("think"));
}
function hasAnswer() {
  const q = state.list[state.i];
  const s = state.sel;
  if (q.type === "listen") return s && s.vals.every(v => normNumber(v) !== "");
  if (q.type === "mc" || q.type === "fill" || q.type === "tf") return s !== null && s !== undefined;
  if (q.type === "match") return s && s.map && q.pairs.every((_, i) => s.map[i] != null);
  if (q.type === "order") return s && s.placed && s.placed.length === q.items.length;
  if (q.type === "build") return s && s.placed && s.placed.length > 0;
  if (q.type === "tiles") return s && s.done === q.pairs.length;
  if (q.type === "write") return s && (s.paper || s.text.trim().length >= 2);
  return false;
}

function choiceButton(body, label, key, value) {
  const b = el("button", { class: "choice", onclick: () => {
    if (state.answered) return;
    state.sel = value;
    [...body.querySelectorAll(".choice")].forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    refreshCheck();
  } }, [
    el("span", { class: "key", text: key }),
    el("span", { class: "label", text: label })
  ]);
  body.appendChild(b);
  return b;
}

function renderChoices(body, q) {
  shuffle(q.choices.map((c, i) => i)).forEach((idx, pos) => {
    const b = choiceButton(body, q.choices[idx], KEYS[pos], idx);
    b.dataset.idx = idx;
  });
}

function renderTF(body, q) {
  [["Doğru", true, "D"], ["Yanlış", false, "Y"]].forEach(([label, val, k]) => {
    const b = choiceButton(body, label, k, val);
    b.dataset.val = String(val);
  });
}

function renderMatch(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Soldakine karşılık gelen kutuya dokun, sonra doğru eşini seç." }));
  const rights = shuffle(q.pairs.map((p, i) => ({ text: p[1], i })));
  state.sel = { map: {}, pending: null };

  const slots = [];
  q.pairs.forEach((p, li) => {
    const right = el("button", { class: "right empty", text: "seç", onclick: () => {
      if (state.answered) return;
      state.sel.pending = state.sel.pending === li ? null : li;
      redraw(); drawPicker();
    } });
    body.appendChild(el("div", { class: "pair" }, [
      el("div", { class: "left", text: p[0] }),
      right
    ]));
    slots.push({ right, li });
  });

  const picker = el("div", { class: "chips" }, []);
  body.appendChild(picker);

  function redraw() {
    slots.forEach(({ right, li }) => {
      const r = state.sel.map[li];
      right.textContent = r == null ? "seç" : q.pairs[r][1];
      right.className = "right" + (r == null ? " empty" : " filled") + (state.sel.pending === li ? " active" : "");
    });
  }
  function drawPicker() {
    picker.innerHTML = "";
    if (state.sel.pending == null) return;
    const used = new Set(Object.values(state.sel.map));
    rights.forEach(r => {
      if (used.has(r.i) && state.sel.map[state.sel.pending] !== r.i) return;
      picker.appendChild(el("button", { class: "chip", text: r.text, onclick: () => {
        if (state.answered) return;
        state.sel.map[state.sel.pending] = r.i;
        state.sel.pending = null;
        picker.innerHTML = "";
        redraw();
        refreshCheck();
      } }));
    });
  }
  state.sel.redraw = redraw;
  redraw();
}

function renderOrder(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Doğru sırayla dokun. Kaldırmak için üstteki kutudan dokun." }));
  const slot = el("div", { class: "slot" }, []);
  const pool = el("div", { class: "chips" }, []);
  body.appendChild(slot);
  body.appendChild(pool);
  state.sel = { placed: [] };

  const shuffled = shuffle(q.items.map((t, i) => ({ t, i })));
  function draw() {
    slot.innerHTML = "";
    state.sel.placed.forEach((it, pos) => {
      const c = el("button", { class: "chip", onclick: () => {
        if (state.answered) return;
        state.sel.placed.splice(pos, 1);
        draw(); refreshCheck();
      } }, []);
      c.appendChild(el("span", { class: "n", text: (pos + 1) }));
      c.appendChild(document.createTextNode(it.t));
      slot.appendChild(c);
    });
    pool.innerHTML = "";
    const used = new Set(state.sel.placed.map(p => p.i));
    shuffled.forEach(it => {
      if (used.has(it.i)) return;
      pool.appendChild(el("button", { class: "chip", text: it.t, onclick: () => {
        if (state.answered) return;
        state.sel.placed.push(it);
        draw(); refreshCheck();
      } }));
    });
  }
  state.sel.draw = draw;
  draw();
}

// kutu eşleştirme: iki sütun karışık dizilir; bir kutuya, sonra karşı sütundaki eşine dokunulur.
// doğru eş anında yeşile döner, yanlış eş kırmızı yanıp söner ve öğrenci yeniden dener;
// hepsi bulununca soru doğru sayılır (hatalı denemeler sadece bilgi olarak gösterilir)
const EMOJI_ONLY = /^[\p{Extended_Pictographic}‍️\s]+$/u;
function renderTiles(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Bir kutuya, sonra karşı sütundaki eşine dokun." }));
  state.sel = { done: 0, mistakes: 0, pick: null };
  const sel = state.sel;
  const cols = [el("div", { class: "tcol" }, []), el("div", { class: "tcol" }, [])];
  body.appendChild(el("div", { class: "tiles" }, cols));

  [0, 1].forEach(side => {
    shuffle(q.pairs.map(p => p[side])).forEach(t => {
      const it = { t, side };
      it.b = el("button", { class: "tile" + (EMOJI_ONLY.test(t) ? " big" : ""), text: t, onclick: () => tap(it) });
      if (EMOJI_ONLY.test(t)) it.b.setAttribute("aria-label", "Resim: " + t);
      cols[side].appendChild(it.b);
    });
  });

  function tap(it) {
    if (state.answered || state.sel !== sel || it.b.disabled) return;
    const p = sel.pick;
    if (!p || p.side === it.side) {
      if (p) p.b.classList.remove("sel");
      sel.pick = p === it ? null : it;
      if (sel.pick) it.b.classList.add("sel");
      return;
    }
    sel.pick = null;
    p.b.classList.remove("sel");
    const l = p.side === 0 ? p : it, r = p.side === 0 ? it : p;
    // metne göre karşılaştır: aynı metni taşıyan iki kutudan hangisi seçilirse seçilsin doğru sayılır
    const ok = q.pairs.some(pr => pr[0] === l.t && pr[1] === r.t);
    if (ok) {
      [l, r].forEach(x => { x.b.classList.add("done"); x.b.disabled = true; });
      sel.done++;
      if (sel.done === q.pairs.length) {
        refreshCheck();
        setTimeout(() => { if (state && state.sel === sel && !state.answered) submit(); }, 450);
      }
    } else {
      sel.mistakes++;
      [l, r].forEach(x => {
        x.b.classList.remove("err");
        void x.b.offsetWidth;
        x.b.classList.add("err");
        setTimeout(() => x.b.classList.remove("err"), 800);
      });
    }
  }
}

// dinleme: metin sesli okunur (yazısı gizli), öğrenci her satırdaki miktarı rakamla yazar.
// "zweihundert" duyulunca 200 yazılır; rakam dışındaki her şey (birim, boşluk) karşılaştırmada yok sayılır
const NUMBER_WORDS = { ein: "1", eins: "1", eine: "1", bir: "1", one: "1" };
function normNumber(v) {
  const t = String(v == null ? "" : v).trim().toLocaleLowerCase("tr");
  if (NUMBER_WORDS[t]) return NUMBER_WORDS[t];
  return t.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "");
}
function renderListen(body, q) {
  const lang = subjectLang(state.key);
  state.sel = { vals: q.blanks.map(() => "") };
  const sel = state.sel;
  const played = () => { if (state.buddy && state.buddy.mood() === "idle") state.buddy.say("think", "İyi dinle, sayılara dikkat!"); };
  if (canSpeak && lang) {
    const play = el("button", { class: "listenbtn", type: "button", onclick: () => { speak(q.tts, lang, 0.85); played(); } }, []);
    play.innerHTML = SPEAK_ICON + "<span>Dinle</span>";
    const slow = el("button", { class: "listenbtn slow", type: "button", onclick: () => { speak(q.tts, lang, 0.55); played(); } }, ["🐢 Yavaş dinle"]);
    body.appendChild(el("div", { class: "listenrow" }, [play, slow]));
  } else {
    // ses yoksa metni yazılı göster: sayılar yine kelimeyle yazılı olduğu için soru anlamını korur
    body.appendChild(el("div", { class: "srccard" }, [q.tts]));
  }
  const subj = SUBJECTS.find(x => x.key === state.key);
  body.appendChild(el("div", { class: "hint", text: "Duyduğun sayıları rakamla yaz. Örneğin " + ((subj && subj.listenHint) || "„zweihundert“ → 200") + "." }));
  const list = el("div", { class: "lgrid" }, []);
  const inputs = [];
  q.blanks.forEach((b, i) => {
    const inp = el("input", {
      type: "text", inputmode: "numeric", autocomplete: "off", class: "lbin",
      "aria-label": b.label + " miktarı", maxlength: "6"
    });
    inp.addEventListener("input", () => { sel.vals[i] = inp.value; refreshCheck(); });
    inp.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (inputs[i + 1]) inputs[i + 1].focus();
      else { inp.blur(); if (hasAnswer()) submit(); }
    });
    inputs.push(inp);
    list.appendChild(el("label", { class: "lrow" }, [inp, el("span", { class: "lunit", text: b.label })]));
  });
  body.appendChild(list);
}

// cümle kurma: bankadaki kelime bloklarına dokunarak cevap satırına dizilir.
// kullanılan bloğun yeri bankada boş kalır, böylece bloklar kaymaz; satırdaki bloğa dokununca geri döner
function renderBuild(body, q) {
  body.appendChild(el("div", { class: "hint", text: "Kelimelere sırayla dokun. Geri almak için satırdaki kelimeye dokun." }));
  const line = el("div", { class: "buildline", "aria-label": "Cevap satırı" }, []);
  const bank = el("div", { class: "wbank" }, []);
  body.appendChild(line);
  body.appendChild(bank);
  state.sel = { placed: [] };
  const sel = state.sel;
  const tokens = shuffle(q.words.concat(q.extra || []).map((t, i) => ({ t, i })));

  function draw() {
    line.innerHTML = "";
    sel.placed.forEach((it, pos) => {
      line.appendChild(el("button", { class: "wchip", text: pos === 0 ? capFirst(it.t) : it.t, onclick: () => {
        if (state.answered) return;
        sel.placed.splice(pos, 1);
        draw(); refreshCheck();
      } }));
    });
    bank.innerHTML = "";
    const used = new Set(sel.placed.map(p => p.i));
    tokens.forEach(it => {
      if (used.has(it.i)) {
        bank.appendChild(el("span", { class: "wchip used", "aria-hidden": "true", text: it.t }));
        return;
      }
      bank.appendChild(el("button", { class: "wchip", text: it.t, onclick: () => {
        if (state.answered) return;
        sel.placed.push(it);
        draw(); refreshCheck();
      } }));
    });
  }
  draw();
}
// açık uçlu yazılı sorusu: öğrenci cevabını yazar (ya da kâğıda yazar). Kontrol et'e basınca
// model cevap ve puanlama ölçütleri açılır; öğrenci cevabında olanları işaretler, Puanla'ya basar.
// Toplam puanın %70'i ve üstü doğru sayılır.
const WRITE_PASS = 0.7;
function writeTotal(q) { return q.rubric.reduce((a, r) => a + r.p, 0); }
function writeScore(q, sel) { return q.rubric.reduce((a, r, i) => a + (sel && sel.marks && sel.marks[i] ? r.p : 0), 0); }
function renderWrite(body, q) {
  state.sel = { text: "", paper: false, grading: false, graded: false, marks: q.rubric.map(() => false), body };
  const sel = state.sel;
  body.appendChild(el("div", { class: "hint", text: "Yazılı kâğıdına yazar gibi cevapla. Sonra model cevapla karşılaştırıp kendini puanlayacaksın (" + writeTotal(q) + " puan)." }));
  const box = el("textarea", { class: "wbox", rows: "6", placeholder: "Cevabın…", "aria-label": "Cevabın", spellcheck: "false" });
  box.addEventListener("input", () => { sel.text = box.value; refreshCheck(); });
  body.appendChild(box);
  const paper = el("button", { class: "paperbtn", type: "button", "aria-pressed": "false", onclick: () => {
    if (sel.grading || state.answered) return;
    sel.paper = !sel.paper;
    paper.classList.toggle("on", sel.paper);
    paper.setAttribute("aria-pressed", String(sel.paper));
    paper.textContent = sel.paper ? "✓ Cevabı kâğıda yazdım" : "Cevabı kâğıda yazdım";
    refreshCheck();
  } }, ["Cevabı kâğıda yazdım"]);
  body.appendChild(paper);
}
function modelBox(q) {
  return el("div", { class: "model" }, [el("b", { text: "Model cevap" }), q.model || q.rubric.map(r => "• " + r.t).join("\n")]);
}
function openGrading(q) {
  const sel = state.sel;
  sel.grading = true;
  const body = sel.body;
  body.querySelectorAll(".wbox, .paperbtn").forEach(x => { x.disabled = true; });
  const model = modelBox(q);
  body.appendChild(model);
  body.appendChild(el("div", { class: "rubrichead", text: "Cevabında hangileri var?" }));
  body.appendChild(el("div", { class: "hint", text: "Dürüst ol, yalnızca gerçekten yazdıklarını işaretle. %70 ve üstü doğru sayılır." }));
  const total = writeTotal(q);
  q.rubric.forEach((r, i) => {
    const key = el("span", { class: "key", text: "" });
    const b = el("button", { class: "choice rub", type: "button", "aria-pressed": "false", onclick: () => {
      if (state.answered) return;
      sel.marks[i] = !sel.marks[i];
      b.classList.toggle("sel", sel.marks[i]);
      b.setAttribute("aria-pressed", String(sel.marks[i]));
      key.textContent = sel.marks[i] ? "✓" : "";
      update();
    } }, [key, el("span", { class: "label", text: r.t }), el("span", { class: "pts", text: r.p + " p" })]);
    b.dataset.i = i;
    body.appendChild(b);
  });
  if (state.buddy) state.buddy.say("think", "Şimdi model cevapla karşılaştır!");
  foot.className = "";
  footinner.innerHTML = "";
  const go = el("button", { class: "btn solid main", onclick: () => { sel.graded = true; submit(); } }, []);
  function update() { go.textContent = "Puanla · " + writeScore(q, sel) + "/" + total; }
  update();
  footinner.appendChild(el("div", { class: "btnrow" }, [go]));
  setTimeout(() => model.scrollIntoView && model.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }), 30);
}

// isim olmayan bloklar veride küçük harfle durur; cümlenin başına gelen blok büyük harfle gösterilir
function capFirst(t) { return t ? t.charAt(0).toLocaleUpperCase("de") + t.slice(1) : t; }
function buildSentence(words) { return capFirst(words.join(" ")); }
// karşılaştırmada büyük/küçük harf ve noktalama yok sayılır; bloklar sabit olduğu için yalnızca sıra önemlidir
function normSentence(words) {
  return words.join(" ").toLocaleLowerCase("de").replace(/[.,!?;:]/g, "").replace(/\s+/g, " ").trim();
}

/* ---------- cevap kontrolü ---------- */

function isCorrect(q) {
  const s = state.sel;
  if (q.type === "listen") return q.blanks.every((b, i) => normNumber(s.vals[i]) === normNumber(b.answer));
  if (q.type === "mc" || q.type === "fill" || q.type === "tf") return s === q.answer;
  // metne göre karşılaştır: aynı karşılığı taşıyan iki çift (ör. iki "Fiziksel") de doğru sayılsın
  if (q.type === "match") return q.pairs.every((p, i) => q.pairs[s.map[i]][1] === p[1]);
  if (q.type === "order") return s.placed.every((p, i) => p.i === i);
  if (q.type === "tiles") return s.done === q.pairs.length;
  if (q.type === "write") return writeScore(q, s) >= WRITE_PASS * writeTotal(q);
  if (q.type === "build") {
    const got = normSentence(s.placed.map(p => p.t));
    return [q.words].concat(q.alt || []).some(a => normSentence(a) === got);
  }
  return false;
}

function correctText(q) {
  if (q.type === "mc" || q.type === "fill") return q.choices[q.answer];
  if (q.type === "tf") return q.answer ? "Doğru" : "Yanlış";
  if (q.type === "match" || q.type === "tiles") return q.pairs.map(p => p[0] + " = " + p[1]).join(", ");
  if (q.type === "order") return q.items.map((t, i) => (i + 1) + ". " + t).join("  ");
  if (q.type === "build") return buildSentence(q.words);
  if (q.type === "listen") return q.blanks.map(b => b.answer + " " + b.label).join(", ");
  if (q.type === "write") return q.model || q.rubric.map(r => r.t).join("; ");
  return "";
}

function submit() {
  if (state.answered || !hasAnswer()) return;
  const q = state.list[state.i];
  // açık uçlu soruda ilk basış puanlama ekranını açar
  if (q.type === "write" && !state.sel.graded) { if (!state.sel.grading) openGrading(q); return; }
  state.answered = true;
  const ok = isCorrect(q);
  record(q.id, ok);
  if (ok) { state.correct++; state.streak++; }
  else { state.wrong.push(q); state.streak = 0; }
  if (state.buddy) {
    state.buddy.say(ok ? "happy" : "sad",
      ok ? (state.streak >= 3 ? state.streak + " doğru üst üste!" : mikeyLine("happy")) : mikeyLine("sad"));
  }

  revealChoices(q);
  showVerdict(q, ok ? "ok" : "bad");
}

// seçenekli sorularda doğru seçeneği yeşil, işaretlenen yanlışı kırmızı gösterir
function revealChoices(q) {
  if (q.type === "mc" || q.type === "fill") {
    app.querySelectorAll(".choice").forEach(b => {
      const idx = Number(b.dataset.idx);
      b.disabled = true;
      b.classList.remove("sel");
      if (idx === q.answer) b.classList.add("ok");
      else if (idx === state.sel) b.classList.add("bad");
    });
  } else if (q.type === "tf") {
    app.querySelectorAll(".choice").forEach(b => {
      const val = b.dataset.val === "true";
      b.disabled = true;
      b.classList.remove("sel");
      if (val === q.answer) b.classList.add("ok");
      else if (val === state.sel) b.classList.add("bad");
    });
  } else if (q.type === "build") {
    app.querySelectorAll(".wchip").forEach(b => { b.disabled = true; });
    const line = app.querySelector(".buildline");
    if (line && state.sel) line.classList.add(isCorrect(q) ? "ok" : "bad");
  } else if (q.type === "tiles") {
    app.querySelectorAll(".tile").forEach(b => { b.disabled = true; b.classList.remove("sel"); });
  } else if (q.type === "write") {
    app.querySelectorAll(".wbox, .paperbtn").forEach(x => { x.disabled = true; });
    app.querySelectorAll(".choice.rub").forEach(b => { b.disabled = true; if (b.classList.contains("sel")) b.classList.add("ok"); });
    // boş bırakılınca model cevap ve ölçütler yine de görünsün
    const box = app.querySelector(".wbox");
    if (box && !app.querySelector(".model")) {
      box.parentNode.appendChild(modelBox(q));
      if (q.model) box.parentNode.appendChild(el("div", { class: "hint" }, ["Puan ölçütleri: " + q.rubric.map(r => r.t + " (" + r.p + " p)").join(" · ")]));
    }
  } else if (q.type === "listen") {
    // her kutu ayrı ayrı: doğrular yeşil, yanlış ya da boş olanların yanında doğrusu
    app.querySelectorAll(".lrow").forEach((row, i) => {
      const inp = row.querySelector("input");
      inp.disabled = true;
      const good = normNumber(inp.value) === normNumber(q.blanks[i].answer);
      row.classList.add(good ? "ok" : "bad");
      if (!good) row.appendChild(el("span", { class: "lfix", text: "→ " + q.blanks[i].answer }));
    });
    // cevaptan sonra metnin yazılısı soru alanında açılır
    const grid = app.querySelector(".lgrid");
    if (grid && !app.querySelector(".transcript")) {
      const tr = el("div", { class: "transcript srccard" }, [el("div", {}, [el("b", { text: "Dinlediğin metin: " })].concat(glossText(q.tts, state.key, () => true)))]);
      const sp = speakButton(q.tts, subjectLang(state.key));
      if (sp) tr.prepend(sp);
      grid.after(tr);
    }
  }
}

function showVerdict(q, kind) {
  const look = {
    ok:   ["img/capy-flex.png", "Doğru"],
    bad:  ["img/capy-hat.png", "Yanlış"],
    skip: ["img/capy-circle.png", "Boş bıraktın"]
  }[kind];
  foot.className = kind;
  footinner.innerHTML = "";
  const row = el("div", { class: "verdictrow" }, [
    el("img", { src: look[0], alt: "", "aria-hidden": "true" }, []),
    el("div", { class: "verdict", text: look[1] })
  ]);
  // kurulan cümlenin doğrusu dersin dilinde dinlenebilir
  const sp = q.type === "build" ? speakButton(buildSentence(q.words), subjectLang(state.key)) : null;
  if (sp) row.appendChild(sp);
  footinner.appendChild(row);
  if (q.type === "write") {
    footinner.appendChild(el("div", { class: "answer" }, kind === "skip"
      ? ["Model cevap ve puan ölçütleri yukarıda."]
      : ["Puanın: ", el("span", { class: "score", text: writeScore(q, state.sel) + "/" + writeTotal(q) }),
         kind === "ok" ? " · yazılıda bu cevap tam puana yakın!" : " · işaretlemediğin ölçütlere bak."]));
  } else if (kind === "ok" && q.type === "tiles" && state.sel && state.sel.mistakes) {
    footinner.appendChild(el("div", { class: "answer", text: "Hepsini buldun! Arada " + state.sel.mistakes + " kez yanlış eşleştirme denedin." }));
  } else if (kind !== "ok" && q.type === "listen") {
    footinner.appendChild(el("div", { class: "answer", text: "Doğrularını kutuların yanında görebilirsin." }));
  } else if (kind !== "ok") {
    footinner.appendChild(el("div", { class: "answer", text: "Doğru cevap: " + correctText(q) }));
  }
  footinner.appendChild(el("div", { class: "why", text: q.why }));
  footinner.appendChild(el("button", { class: "btn solid", onclick: nextQuestion }, [
    state.i + 1 < state.list.length ? "Devam" : "Turu bitir"
  ]));
  footinner.querySelector(".btn").focus({ preventScroll: true });
}

function skipQuestion() {
  if (state.answered) return;
  const q = state.list[state.i];
  state.answered = true;
  state.sel = null;
  state.skipped.push(q);
  state.streak = 0;
  recordSkip(q.id);
  if (state.buddy) state.buddy.say("think", mikeyLine("skip"));
  revealChoices(q);
  showVerdict(q, "skip");
}

function nextQuestion() {
  state.i++;
  if (state.i >= state.list.length) renderResult();
  else renderQuestion();
}

/* ---------- tur sonu ---------- */

function renderResult() {
  store.rounds = (store.rounds || 0) + 1;
  saveStore();
  foot.hidden = true;
  app.innerHTML = "";
  app.appendChild(topbar(() => renderSubject(state.key)));

  const n = state.list.length;
  const wrongCount = state.wrong.length;
  const skipCount = state.skipped.length;
  const missCount = wrongCount + skipCount;
  app.appendChild(el("img", {
    class: "resultart", alt: "", "aria-hidden": "true",
    src: missCount === 0 ? "img/capy-hands.png" : "img/capy-flex.png"
  }, []));
  const stamp = el("div", { class: "stamp" }, [
    el("div", { class: "ring", "aria-hidden": "true" }, []),
    el("div", { class: "num", text: state.correct + "/" + n })
  ]);
  app.appendChild(el("div", { class: "grade" }, [
    stamp,
    el("p", { class: "note", text: missCount === 0 ? "Hepsi doğru."
      : [wrongCount ? wrongCount + " yanlış" : "", skipCount ? skipCount + " boş" : ""].filter(Boolean).join(", ") + "; aşağıda duruyorlar." })
  ]));
  const ratio = state.correct / n;
  const [mood, line] =
    missCount === 0 ? ["happy", "Mükemmel, hepsi doğru!"]
    : ratio >= 0.7 ? ["happy", "Çok iyiydi, böyle devam!"]
    : ratio >= 0.4 ? ["think", "Fena değil, yanlışlara bakalım."]
    : ["sad", "Olsun, tekrar edince oturacak."];
  app.appendChild(buddy(mood, line, "resultbuddy").row);
  // turun tek animasyonu: daire kalemle çizilmiş gibi oturur
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    stamp.querySelector(".ring").animate(
      [
        { transform: "scale(.7) rotate(-14deg)", opacity: 0 },
        { transform: "rotate(-5deg)", opacity: 1 }
      ],
      { duration: 480, delay: 120, easing: "cubic-bezier(.2,1.5,.4,1)", fill: "backwards" }
    );
  }

  const key = state.key, unit = state.unit;

  if (missCount) {
    // kaçırılanlar turdaki sırasıyla: yanlışlar ve boşlar birlikte
    const misses = state.list.filter(q => state.wrong.includes(q) || state.skipped.includes(q));
    app.appendChild(el("button", { class: "btn solid", onclick: () => startRound(key, unit, misses) }, [
      skipCount && !wrongCount ? "Boşları tekrar et" : skipCount ? "Yanlış ve boşları tekrar et" : "Yanlışları tekrar et"
    ]));
    const box = el("div", { class: "review" }, [el("h2", { text: "Kaçırdıkların" })]);
    misses.forEach(q => {
      const skipped = state.skipped.includes(q);
      box.appendChild(el("div", { class: "miss" + (skipped ? " skipped" : "") }, [
        el("span", { class: "tag " + (skipped ? "s" : "w"), text: skipped ? "Boş" : "Yanlış" }),
        el("div", { class: "q", text: q.src ? q.q + " " + q.src : q.q }),
        el("div", { class: "a", text: correctText(q) }),
        el("div", { class: "e", text: q.why })
      ]));
    });
    app.appendChild(box);
    app.appendChild(el("button", { class: "btn", onclick: () => startRound(key, unit) }, ["Yeni tur"]));
  } else {
    app.appendChild(el("button", { class: "btn solid", onclick: () => startRound(key, unit) }, ["Yeni tur"]));
  }
  app.appendChild(el("button", { class: "btn ghost", onclick: () => renderSubject(key) }, ["Konulara dön"]));
  app.appendChild(el("p", { class: "sign", text: "ahmojunior" }));
}

/* ---------- başlat ---------- */

loadStore();
const introAt = Date.now();
loadBanks().then(() => {
  renderHome();
  // açılış ekranı en az bu kadar durur, yoksa yükleme hızlıysa göz kırpıp geçer
  setTimeout(() => {
    const intro = document.getElementById("intro");
    intro.classList.add("gone");
    setTimeout(() => intro.remove(), 450);
  }, Math.max(0, 1200 - (Date.now() - introAt)));
});
</script>
</body>
</html>
